<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  :root{
    --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,.08);
    --text:#1a1a18;--text2:#6b6b65;--text3:#a0a09a;
    --accent:#2d6a4f;--accent-l:#e8f5ee;--accent2:#e76f51;--accent2-l:#fdf0ec;
    --r:16px;--rs:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:#1a1a18;padding:.55rem 1rem;display:flex;align-items:center;justify-content:center}
  .logo-text{font-family:'Arial Black','Arial',sans-serif;font-size:20px;font-weight:900;letter-spacing:2px;color:#F5A623}
  .logo-text span{color:#E8162B}
  .logo-sub{font-size:11px;color:rgba(255,255,255,.35);margin-left:10px;letter-spacing:.1em}
  .nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 .5rem;position:sticky;top:0;z-index:100}
  .nb{flex:1;padding:.85rem .3rem;background:none;border:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
  .nb.active{color:var(--accent);border-bottom-color:var(--accent)}
  .page{display:none;padding:1.25rem 1rem 4rem;max-width:480px;margin:0 auto}
  .page.active{display:block}
  .card{background:var(--surface);border-radius:var(--r);padding:1.25rem;border:1px solid var(--border);margin-bottom:1rem}
  .ct{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.875rem}
  input,select{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:15px;color:var(--text);background:var(--surface2);outline:none;transition:border-color .2s;margin-bottom:.65rem}
  input:focus,select:focus{border-color:var(--accent);background:#fff}
  .btn{width:100%;padding:.85rem;border:none;border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;margin-bottom:.4rem}
  .btn:active{transform:scale(.98)}
  .bp{background:var(--accent);color:#fff}
  .bs{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  #qr-wrap{display:flex;justify-content:center;align-items:center;padding:1.25rem;background:#fff;border-radius:var(--rs);margin:.875rem 0;border:2px dashed var(--border);min-height:180px}
  .alive-badge{display:flex;align-items:center;gap:8px;background:var(--accent-l);border-radius:var(--rs);padding:.7rem 1rem;margin-bottom:.875rem;font-size:14px;font-weight:500;color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.5s infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .mi{display:flex;align-items:center;gap:10px;padding:.65rem 0;border-bottom:1px solid var(--border)}
  .mi:last-child{border-bottom:none}
  .av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .mn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mm{font-size:12px;color:var(--text3);margin-top:1px}
  .gp{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;background:var(--accent-l);color:var(--accent);white-space:nowrap;flex-shrink:0}
  .gp.mate{background:#fff3e0;color:#e65100}
  .gp.gray{background:var(--surface2);color:var(--text3)}
  .sr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.875rem}
  .sb2{background:var(--surface2);border-radius:var(--rs);padding:.875rem .5rem;text-align:center}
  .sn{font-size:22px;font-weight:700;color:var(--accent)}
  .sl{font-size:11px;color:var(--text3);margin-top:2px}
  .sc{text-align:center;padding:1.75rem 1.25rem}
  .se{font-size:60px;margin-bottom:.875rem}
  .st{font-size:21px;font-weight:700;margin-bottom:.4rem}
  .ss{font-size:14px;color:var(--text2)}
  .gu{margin-top:.875rem;background:var(--accent2-l);color:var(--accent2);border-radius:var(--rs);padding:.7rem;font-weight:700;font-size:14px}
  .toast-el{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1a18;color:#fff;padding:.7rem 1.4rem;border-radius:100px;font-size:14px;font-weight:500;transition:transform .3s;z-index:999;white-space:nowrap}
  .toast-el.show{transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;padding:1.5rem;color:var(--text3);font-size:14px}
  .sl2{font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.05em;margin-bottom:.4rem}
  .divider{border:none;border-top:1px solid var(--border);margin:.875rem 0}
  .mb-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
  .mb-bg.open{display:flex}
  .modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:1.5rem;width:100%;max-width:480px}
  .mt2{font-size:16px;font-weight:700;margin-bottom:1rem}
  .dbtn{background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-family:inherit;cursor:pointer}
  .ebtn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .loading{text-align:center;padding:2rem;color:var(--text3);font-size:14px}
  .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:.5rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  #admin-lock{text-align:center;padding:3rem 1.5rem}
  #admin-lock .lock-icon{font-size:48px;margin-bottom:1rem}
  #admin-lock .lock-title{font-size:18px;font-weight:700;margin-bottom:.5rem}
  #admin-lock .lock-sub{font-size:14px;color:var(--text3);margin-bottom:1.5rem}

  /* 출석탭 체크박스 멤버 리스트 */
  .ci-member-item{display:flex;align-items:center;gap:10px;padding:.65rem 0;border-bottom:1px solid var(--border);cursor:pointer}
  .ci-member-item:last-child{border-bottom:none}
  .ci-member-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0;cursor:pointer;margin:0}
  .ci-member-item.already{opacity:.4;pointer-events:none}

  /* 모임탭 */
  .session-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);margin-bottom:.75rem;overflow:hidden}
  .session-card-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;cursor:pointer}
  .session-card-body{padding:0 1.25rem 1rem;display:none}
  .session-card-body.open{display:block}
  .att-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--surface2);border-radius:20px;padding:3px 10px;margin:3px 3px 3px 0;color:var(--text2)}
</style>
</head>
<body>
<header>
  <div class="logo-text">DO<span>R</span>DO</div>
  <div class="logo-sub">출석체크</div>
</header>
<nav class="nav">
  <button class="nb active" onclick="showPage('members',this)">👥 멤버</button>
  <button class="nb" onclick="showPage('sessions',this)">📅 모임</button>
  <button class="nb" onclick="showPage('checkin',this)">✅ 출석</button>
  <button class="nb" onclick="showPage('admin',this)">🔥 운영진</button>
</nav>
<div id="toast-el" class="toast-el"></div>

<!-- Edit Modal -->
<div class="mb-bg" id="edit-modal">
  <div class="modal">
    <div class="mt2">멤버 수정</div>
    <input type="hidden" id="edit-id"/>
    <div class="sl2">이름/동네</div>
    <input type="text" id="edit-name" placeholder="이름/동네"/>
    <div class="sl2">직책</div>
    <select id="edit-role"><option value="member">일반 멤버</option><option value="mate">🔥 메이트 (운영진)</option></select>
    <div class="sl2">출석 횟수</div>
    <input type="number" id="edit-count" min="0" placeholder="0"/>
    <div class="sl2">가입일 (YYMMDD)</div>
    <input type="text" id="edit-joined" placeholder="예: 230410"/>
    <div style="display:flex;gap:.5rem;margin-top:.5rem">
      <button class="btn bp" style="flex:1;margin:0;padding:.75rem" onclick="saveEdit()">저장</button>
      <button class="btn bs" style="flex:1;margin:0;padding:.75rem" onclick="closeModal()">취소</button>
    </div>
  </div>
</div>

<!-- MEMBERS -->
<div id="page-members" class="page active">
  <div class="sr">
    <div class="sb2"><div class="sn" id="m-total">-</div><div class="sl">전체</div></div>
    <div class="sb2"><div class="sn" id="m-act">-</div><div class="sl">5회 이상</div></div>
    <div class="sb2"><div class="sn" id="m-sess">-</div><div class="sl">총 모임</div></div>
  </div>
  <div class="card">
    <div class="ct">멤버 목록</div>
    <div id="mlist"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
  </div>
</div>

<!-- SESSIONS (모임탭) -->
<div id="page-sessions" class="page">
  <div id="sess-list"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
</div>

<!-- CHECK-IN -->
<div id="page-checkin" class="page">
  <div id="ci-normal">
    <div class="card">
      <div class="ct">모임 선택</div>
      <div id="ci-sess-list"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
    </div>
    <div class="card" id="ci-member-card" style="display:none">
      <div class="ct">출석 멤버 선택</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
        <span style="font-size:13px;color:var(--text3)" id="ci-check-count">0명 선택</span>
        <button onclick="selectAllCi()" style="background:none;border:none;font-size:13px;color:var(--accent);cursor:pointer;font-family:inherit">전체선택</button>
      </div>
      <div id="ci-member-list"></div>
      <button class="btn bp" style="margin-top:1rem" onclick="doCheckin()">출석 체크인 ✓</button>
    </div>
  </div>
  <div id="ci-success" style="display:none">
    <div class="card sc">
      <div class="se">✅</div>
      <div class="st" id="s-name">출석 완료!</div>
      <div class="ss" id="s-count"></div>
    </div>
    <button class="btn bs" onclick="resetCi()">다시 체크인</button>
  </div>
</div>

<!-- ADMIN -->
<div id="page-admin" class="page">
  <div id="admin-lock">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">운영진 전용</div>
    <div class="lock-sub">비밀번호를 입력해주세요</div>
    <input type="password" id="admin-pw" placeholder="비밀번호" style="max-width:280px;display:block;margin:0 auto .75rem" onkeydown="if(event.key==='Enter')checkPw()"/>
    <button class="btn bp" style="max-width:280px;margin:0 auto" onclick="checkPw()">입장</button>
  </div>
  <div id="admin-content" style="display:none">
    <!-- 모임 생성 -->
    <div class="card">
      <div class="ct">모임 등록</div>
      <div class="sl2">모임 이름</div>
      <input type="text" id="session-name" placeholder="예: 5월 정기 러닝"/>
      <div class="sl2">날짜</div>
      <input type="date" id="session-date"/>
      <button class="btn bp" onclick="createSession()">모임 등록</button>
    </div>

    <!-- 등록된 모임 목록 -->
    <div class="card">
      <div class="ct">등록된 모임</div>
      <div id="admin-sess-list"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
    </div>

    <!-- 멤버 관리 -->
    <div class="card">
      <div class="ct">멤버 관리</div>
      <div style="display:flex;gap:8px;margin-bottom:.65rem">
        <input type="text" id="nm-name" placeholder="이름/동네" style="margin:0;flex:1"/>
        <select id="nm-role" style="margin:0;width:auto;flex-shrink:0"><option value="member">멤버</option><option value="mate">🔥 메이트</option></select>
      </div>
      <button class="btn bs" onclick="addMember()">멤버 추가</button>
      <hr class="divider"/>
      <div id="admin-mlist"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, getDocs, onSnapshot, addDoc, query, orderBy, where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw",
  authDomain: "dordo-17766.firebaseapp.com",
  projectId: "dordo-17766",
  storageBucket: "dordo-17766.firebasestorage.app",
  messagingSenderId: "616591115480",
  appId: "1:616591115480:web:ade08d721401f9f6ec03ad"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const ADMIN_PW = "dordo2024";

// 가입일 매핑 (YYMMDD)
const JOIN_DATES = {
  '김병희/덕풍': '230410',
  '성준/미사':   '230715',
  '장지연/미사': '230916',
  '왕신민/미사': '231013',
  '최형규/미사': '240501',
  '주성/미사':   '240620',
  '박현정/망월': '250301',
  '김민호/경기광주': '250507',
  '정다운/미사': '250511',
  '양윤석/덕풍': '250512',
  '민연희/미사': '250525',
  '우빛나/미사': '250530',
  '이삭/양평':   '250619',
  '은지/미사':   '250623',
  '박성민/덕풍': '250804',
  '가은/미사':   '250817',
  '도영/덕풍':   '250904',
  '큐성/덕풍':   '260128',
  '최예인/미사': '260411',
  '이정민/미사': '260422',
  '대훈/덕풍':   '260430',
  '원재윤':      '260422',
};

function fmtJoined(raw) {
  if (!raw) return '';
  const s = String(raw);
  if (s.length === 6) return `20${s.slice(0,2)}.${s.slice(2,4)}.${s.slice(4,6)}`;
  return s;
}

// ── 등급 ────────────────────────────────────────
const grade = m => {
  if (m.role === 'mate') return {e:'🔥', n:'메이트'};
  if (m.count >= 15) return {e:'🦢', n:'베테랑'};
  if (m.count >= 5)  return {e:'🐥', n:'활동 멤버'};
  if (m.count >= 1)  return {e:'🐣', n:'새내기'};
  return {e:'🥚', n:'미참석'};
};

// ── 페이지 전환 ─────────────────────────────────
window.showPage = function(n, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + n).classList.add('active');
  if (btn) btn.classList.add('active');
  if (n === 'members') renderMPage();
  if (n === 'sessions') renderSessions();
  if (n === 'checkin') renderCiPage();
};

// ── Firestore helpers ───────────────────────────
async function getMembers() {
  const snap = await getDocs(collection(db, 'members'));
  return snap.docs.map(d => ({id: d.id, ...d.data()}));
}
async function getAllSessions() {
  const snap = await getDocs(query(collection(db, 'sessions'), orderBy('date','desc')));
  return snap.docs.map(d => ({id: d.id, ...d.data()}));
}

// ── 어드민 비번 ─────────────────────────────────
window.checkPw = function() {
  if (document.getElementById('admin-pw').value === ADMIN_PW) {
    document.getElementById('admin-lock').style.display = 'none';
    document.getElementById('admin-content').style.display = 'block';
    renderAMList();
    renderAdminSessList();
    document.getElementById('session-date').value = new Date().toISOString().split('T')[0];
  } else {
    toast('비밀번호가 틀렸어요');
    document.getElementById('admin-pw').value = '';
  }
};

// ── 모임 생성 (admin) ────────────────────────────
window.createSession = async function() {
  const name = document.getElementById('session-name').value.trim();
  const date = document.getElementById('session-date').value;
  if (!name) { toast('모임 이름을 입력해주세요'); return; }
  if (!date) { toast('날짜를 선택해주세요'); return; }
  await addDoc(collection(db, 'sessions'), { name, date, attendees: [], createdAt: Date.now() });
  document.getElementById('session-name').value = '';
  toast('모임이 등록됐어요! 🎉');
  renderAdminSessList();
  renderSessions();
};

async function renderAdminSessList() {
  const sessions = await getAllSessions();
  const el = document.getElementById('admin-sess-list');
  if (!sessions.length) { el.innerHTML = '<div class="empty">등록된 모임이 없어요</div>'; return; }
  const today = new Date().toISOString().split('T')[0];
  el.innerHTML = sessions.map(s => {
    const isPast = s.date < today;
    return `<div class="mi">
      <div style="flex:1;min-width:0">
        <div class="mn">${s.name}</div>
        <div class="mm">${s.date} · ${(s.attendees||[]).length}명 출석${isPast?' · 종료':' · 예정'}</div>
      </div>
      <button onclick="deleteSession('${s.id}')" class="dbtn">삭제</button>
    </div>`;
  }).join('');
}

window.deleteSession = async function(id) {
  if (!confirm('이 모임을 삭제할까요?')) return;
  await deleteDoc(doc(db, 'sessions', id));
  renderAdminSessList();
  renderSessions();
  toast('삭제됐어요');
};

// ── 모임탭 ──────────────────────────────────────
async function renderSessions() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  const el = document.getElementById('sess-list');
  if (!sessions.length) { el.innerHTML = '<div class="empty">등록된 모임이 없어요</div>'; return; }
  const today = new Date().toISOString().split('T')[0];

  el.innerHTML = sessions.map(s => {
    const isPast = s.date < today;
    const att = s.attendees || [];
    const chips = att.map(a => {
      const m = members.find(m => m.id === a.memberId);
      return m ? `<span class="att-chip">${grade(m).e} ${m.name}</span>` : '';
    }).join('');
    return `<div class="session-card">
      <div class="session-card-header" onclick="toggleSessCard(this)">
        <div>
          <div style="font-weight:500;font-size:15px">${s.name}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">${s.date} · ${att.length}명 출석</div>
        </div>
        <span style="font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;background:${isPast?'var(--surface2)':'var(--accent-l)'};color:${isPast?'var(--text3)':'var(--accent)'}">${isPast?'종료':'예정'}</span>
      </div>
      <div class="session-card-body">
        ${att.length ? `<div style="padding-bottom:.5rem">${chips}</div>` : '<div style="font-size:13px;color:var(--text3);padding-bottom:.5rem">출석 멤버 없음</div>'}
      </div>
    </div>`;
  }).join('');
}

window.toggleSessCard = function(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
};

// ── 출석 체크인탭 ────────────────────────────────
let selectedSessionId = null;
let checkedMembers = new Set();

async function renderCiPage() {
  selectedSessionId = null;
  checkedMembers = new Set();
  document.getElementById('ci-normal').style.display = 'block';
  document.getElementById('ci-success').style.display = 'none';
  document.getElementById('ci-member-card').style.display = 'none';

  const sessions = await getAllSessions();
  const today = new Date().toISOString().split('T')[0];
  // 오늘 이후 모임만 (오늘 포함)
  const upcoming = sessions.filter(s => s.date >= today).sort((a,b) => a.date.localeCompare(b.date));
  const el = document.getElementById('ci-sess-list');
  if (!upcoming.length) {
    el.innerHTML = '<div class="empty">예정된 모임이 없어요<br>운영진 탭에서 모임을 먼저 등록해주세요</div>';
    return;
  }
  el.innerHTML = upcoming.map(s => `
    <div class="mi" style="cursor:pointer" onclick="selectSession('${s.id}','${s.name}','${s.date}')">
      <div class="av">📅</div>
      <div style="flex:1">
        <div class="mn">${s.name}</div>
        <div class="mm">${s.date} · ${(s.attendees||[]).length}명 출석</div>
      </div>
      <span style="font-size:18px;color:var(--accent)">›</span>
    </div>`).join('');
}

window.selectSession = async function(id, name, date) {
  selectedSessionId = id;
  checkedMembers = new Set();
  document.getElementById('ci-member-card').style.display = 'block';

  const [members, sessSnap] = await Promise.all([getMembers(), getDoc(doc(db, 'sessions', id))]);
  const sess = sessSnap.data();
  const alreadyIds = new Set((sess.attendees||[]).map(a => a.memberId));
  const nonMates = members.filter(m => m.role !== 'mate').sort((a,b) => a.name.localeCompare(b.name,'ko'));

  document.getElementById('ci-member-list').innerHTML = nonMates.map(m => {
    const already = alreadyIds.has(m.id);
    const g = grade(m);
    return `<div class="ci-member-item ${already?'already':''}" onclick="toggleCiMember(this,'${m.id}')">
      <input type="checkbox" id="cb-${m.id}" ${already?'checked disabled':''} onchange="updateCiCount()"/>
      <div class="av">${g.e}</div>
      <div style="flex:1;min-width:0">
        <div class="mn">${m.name}</div>
        <div class="mm">${already?'✓ 출석완료':m.count+'회 참석'}</div>
      </div>
    </div>`;
  }).join('');
  updateCiCount();
};

window.toggleCiMember = function(el, id) {
  if (el.classList.contains('already')) return;
  const cb = el.querySelector('input[type=checkbox]');
  cb.checked = !cb.checked;
  if (cb.checked) checkedMembers.add(id);
  else checkedMembers.delete(id);
  updateCiCount();
};

window.selectAllCi = function() {
  document.querySelectorAll('.ci-member-item:not(.already) input[type=checkbox]').forEach(cb => {
    cb.checked = true;
    checkedMembers.add(cb.id.replace('cb-',''));
  });
  updateCiCount();
};

function updateCiCount() {
  checkedMembers.clear();
  document.querySelectorAll('.ci-member-item:not(.already) input[type=checkbox]:checked').forEach(cb => {
    checkedMembers.add(cb.id.replace('cb-',''));
  });
  document.getElementById('ci-check-count').textContent = checkedMembers.size + '명 선택';
}

window.doCheckin = async function() {
  if (!selectedSessionId) { toast('모임을 선택해주세요'); return; }
  if (!checkedMembers.size) { toast('출석할 멤버를 선택해주세요'); return; }

  const sessRef = doc(db, 'sessions', selectedSessionId);
  const sessSnap = await getDoc(sessRef);
  const sess = sessSnap.data();
  const existingIds = new Set((sess.attendees||[]).map(a => a.memberId));

  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const newAttendees = [...(sess.attendees||[])];

  for (const mid of checkedMembers) {
    if (existingIds.has(mid)) continue;
    newAttendees.push({ memberId: mid, time });
    const mRef = doc(db, 'members', mid);
    const mSnap = await getDoc(mRef);
    if (mSnap.exists()) {
      await updateDoc(mRef, { count: (mSnap.data().count||0) + 1 });
    }
  }
  await updateDoc(sessRef, { attendees: newAttendees });

  document.getElementById('ci-normal').style.display = 'none';
  document.getElementById('ci-success').style.display = 'block';
  document.getElementById('s-name').textContent = checkedMembers.size + '명 출석 완료!';
  document.getElementById('s-count').textContent = sess.name + ' · ' + sess.date;
  toast('출석 처리됐어요 🎉');
};

window.resetCi = function() {
  selectedSessionId = null;
  checkedMembers = new Set();
  document.getElementById('ci-normal').style.display = 'block';
  document.getElementById('ci-success').style.display = 'none';
  document.getElementById('ci-member-card').style.display = 'none';
  renderCiPage();
};

// ── 멤버 페이지 ──────────────────────────────────
async function renderMPage() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  const mates = members.filter(m => m.role === 'mate').sort((a,b)=>{
    const order = ['호정/리더','주동준/운동메이트','황윤정/소통메이트'];
    return order.indexOf(a.name) - order.indexOf(b.name);
  });
  const mems = [...members.filter(m => m.role !== 'mate')].sort((a,b) => b.count - a.count || a.name.localeCompare(b.name,'ko'));

  document.getElementById('mlist').innerHTML = [...mates,...mems].map(m => {
    const g = grade(m);
    const isMate = m.role === 'mate';
    // 오른쪽 뱃지: 운영진은 직책명, 일반멤버는 가입일
    const joined = m.joined || JOIN_DATES[m.name] || '';
    const rightLabel = isMate
      ? (m.name.includes('리더') ? '리더' : m.name.includes('운동') ? '운동메이트' : '소통메이트')
      : (joined ? fmtJoined(joined) : '');
    return `<div class="mi">
      <div class="av">${g.e}</div>
      <div style="flex:1;min-width:0">
        <div class="mn">${m.name}</div>
        <div class="mm">${isMate ? '운영진' : m.count + '회 참석'}</div>
      </div>
      <span class="gp ${isMate?'mate':rightLabel?'gray':''}" style="${!isMate&&rightLabel?'background:var(--surface2);color:var(--text3)':''}">
        ${isMate ? rightLabel : (rightLabel || g.n)}
      </span>
    </div>`;
  }).join('') || '<div class="empty">멤버가 없어요</div>';

  document.getElementById('m-total').textContent = members.length;
  document.getElementById('m-act').textContent = members.filter(m => m.count >= 5).length;
  document.getElementById('m-sess').textContent = sessions.length;
}

// ── 어드민 멤버 관리 ─────────────────────────────
async function renderAMList() {
  const members = await getMembers();
  const mates = members.filter(m => m.role === 'mate');
  const mems = members.filter(m => m.role !== 'mate').sort((a,b) => a.name.localeCompare(b.name,'ko'));
  let h = '';
  if (mates.length) {
    h += `<div style="font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.05em;margin-bottom:6px">운영진</div>`;
    h += mates.map(amRow).join('');
    h += `<div style="font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.05em;margin:10px 0 6px">멤버 (${mems.length}명)</div>`;
  }
  h += mems.map(amRow).join('');
  document.getElementById('admin-mlist').innerHTML = h || '<div class="empty">멤버가 없어요</div>';
}

const amRow = m => {
  const g = grade(m);
  return `<div class="mi"><div class="av">${g.e}</div><div style="flex:1;min-width:0"><div class="mn">${m.name}</div><div class="mm">${m.role==='mate'?'운영진':m.count+'회'}</div></div><button onclick="openEdit('${m.id}')" class="ebtn" style="margin-right:4px">수정</button><button onclick="delMember('${m.id}')" class="dbtn">삭제</button></div>`;
};

window.addMember = async function() {
  const name = document.getElementById('nm-name').value.trim();
  const role = document.getElementById('nm-role').value;
  if (!name) { toast('이름을 입력해주세요'); return; }
  const joined = JOIN_DATES[name] || '';
  await addDoc(collection(db, 'members'), { name, role, count: 0, joined });
  document.getElementById('nm-name').value = '';
  renderAMList();
  toast(name + ' 추가됐어요!');
};

window.openEdit = async function(id) {
  const d = await getDoc(doc(db, 'members', id));
  if (!d.exists()) return;
  const m = d.data();
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-name').value = m.name;
  document.getElementById('edit-role').value = m.role;
  document.getElementById('edit-count').value = m.count;
  document.getElementById('edit-joined').value = m.joined || JOIN_DATES[m.name] || '';
  document.getElementById('edit-modal').classList.add('open');
};

window.saveEdit = async function() {
  const id = document.getElementById('edit-id').value;
  await updateDoc(doc(db, 'members', id), {
    name: document.getElementById('edit-name').value.trim(),
    role: document.getElementById('edit-role').value,
    count: parseInt(document.getElementById('edit-count').value) || 0,
    joined: document.getElementById('edit-joined').value.trim(),
  });
  closeModal(); renderAMList(); renderMPage(); toast('수정됐어요!');
};

window.closeModal = function() { document.getElementById('edit-modal').classList.remove('open'); };

window.delMember = async function(id) {
  const d = await getDoc(doc(db, 'members', id));
  if (!confirm((d.data()?.name||'') + ' 삭제할까요?')) return;
  await deleteDoc(doc(db, 'members', id));
  renderAMList(); renderMPage(); toast('삭제됐어요');
};
