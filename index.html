<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f8f9fa; --surface:#fff; --surface2:#efeff0; --border:rgba(0,0,0,.05);
  --text:#1a1a1b; --text2:#666; --text3:#999;
  --accent:#2d6a4f; --accent-l:#e8f5ee; --accent2:#e76f51; --my-highlight: #dfff00;
  --r:20px; --rs:12px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; appearance:none; -webkit-appearance:none;}
body{font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;}
header{background:#1a1a18; padding:1rem; text-align:center; position:sticky; top:0; z-index:200;}
.logo-text{font-family:'Arial Black',sans-serif; font-size:18px; font-weight:900; letter-spacing:1px; color:#F5A623}
.logo-text span{color:#E8162B}

/* 네비게이션 */
.nav{display:flex; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:100; padding:0 0.5rem;}
.nb{flex:1; padding:1rem 0; background:none; border:none; font-size:11px; font-weight:500; color:var(--text3); cursor:pointer; position:relative; transition:0.2s;}
.nb.active{color:var(--accent); font-weight:700;}
.nb.active::after{content:''; position:absolute; bottom:0; left:25%; width:50%; height:3px; background:var(--accent); border-radius:10px 10px 0 0;}

/* 페이지 레이아웃 */
.page{display:none; padding:1.25rem 1rem 5rem; max-width:480px; margin:0 auto;}
.page.active{display:block;}
.card{background:var(--surface); border-radius:var(--rs); padding:1.25rem; border:1px solid var(--border); margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,0.02);}
.ct{font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.875rem}

/* 깔끔한 입력창 스타일 */
input, select {
  width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: var(--rs);
  font-family: inherit; font-size: 14px; background: var(--surface2); color: var(--text);
  outline: none; margin-bottom: 0.75rem; transition: border-color 0.2s;
}
input:focus { border-color: var(--accent); background: #fff; }

/* 탭 스타일 */
.tab-container { display:flex; background:var(--surface2); border-radius:100px; padding:4px; margin-bottom:1.5rem; }
.tab-btn { flex:1; padding:8px 0; border:none; border-radius:100px; font-size:13px; font-weight:600; color:var(--text3); background:none; cursor:pointer; }
.tab-btn.active { background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,0.05); }

/* 필터 칩 */
.filter-group { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:0.8rem; }
.filter-chip { padding:6px 14px; border-radius:100px; border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--text2); cursor:pointer; }
.filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
#sort-toggle { float:right; border:1px solid var(--border); background:var(--surface); padding:4px 12px; border-radius:20px; font-size:11px; color:var(--text2); font-weight:700; margin-bottom:10px; cursor:pointer; }

/* 리스트 항목 및 하이라이트 */
.mi{display:flex; align-items:center; gap:12px; padding:0.8rem 0; border-bottom:1px solid var(--border);}
.mi.is-me { background:var(--my-highlight) !important; border-radius:12px; padding-left:10px; padding-right:10px; border:none; margin:4px 0; }
.av{width:40px; height:40px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:18px;}
.mn{font-size:15px; font-weight:600;}

/* 출석 바 */
.att-bar-bg{background:var(--surface2); border-radius:100px; height:8px; width:100%; overflow:hidden; margin-top:6px;}
.att-bar-fill{background:var(--accent); height:100%; border-radius:100px; transition:width 0.6s ease;}

/* 버튼 및 칩 */
.btn-main { width:100%; padding:0.85rem; border:none; border-radius:var(--rs); font-size:14px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; margin-bottom:0.5rem;}
.btn-sub { width:100%; padding:0.85rem; border:1px solid var(--border); border-radius:var(--rs); font-size:14px; font-weight:700; background:var(--surface2); color:var(--text2); }
.btn-kakao { background:#FEE500; color:#191919; border:none; margin-top:5px; display:flex; align-items:center; justify-content:center; gap:6px; }

.att-list-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.att-chip { padding: 4px 10px; background: var(--surface2); border-radius: 20px; font-size: 12px; color: var(--text2); font-weight: 500; border: 1px solid var(--border); }
.att-chip.is-me { background: var(--my-highlight) !important; color: #000; font-weight: 700; border-color: transparent; }

/* 토스트 및 모달 */
.toast-el{position:fixed; bottom:5rem; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:100px; font-size:13px; opacity:0; transition:0.3s; z-index:999;}
.toast-el.show{opacity:1; bottom:6rem;}
.mb-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; align-items:flex-end; justify-content:center}
.mb-bg.open{display:flex}
.modal{background:var(--surface); border-radius:var(--r) var(--r) 0 0; padding:1.5rem; width:100%; max-width:480px; max-height:85vh; overflow-y:auto}

.game-result { text-align:center; padding:1.5rem 0; font-size:22px; font-weight:700; color:var(--accent); min-height:80px; display:flex; align-items:center; justify-content:center; flex-direction:column; }
</style>
</head>
<body>
<header><div class="logo-text">DO<span>R</span>DO</div></header>
<nav class="nav">
  <button class="nb active" data-page="members">👥 멤버</button>
  <button class="nb" data-page="sessions">📅 일정</button>
  <button class="nb" data-page="rules">📌 회칙</button>
  <button class="nb" data-page="game">🎮 게임</button>
  <button class="nb" data-page="admin">🔥 운영진</button>
</nav>

<div id="toast-el" class="toast-el"></div>

<div class="mb-bg" id="user-setting-modal">
  <div class="modal">
    <div style="font-size:16px; font-weight:700; margin-bottom:1rem;">👋 누구신가요?</div>
    <div id="user-select-list" style="max-height:50vh; overflow-y:auto; margin-bottom:1rem;"></div>
    <button class="btn-sub" onclick="closeModal('user-setting-modal')">나중에 하기</button>
  </div>
</div>

<div id="page-members" class="page active">
  <div class="tab-container"><button class="tab-btn active" data-mtab="list">멤버 목록</button><button class="tab-btn" data-mtab="stats">출석 통계</button></div>
  <div id="mtab-list"><div class="card"><div id="mlist"></div></div></div>
  <div id="mtab-stats" style="display:none">
    <div class="filter-group"><button class="filter-chip active" data-filter="all">전체</button><button class="filter-chip" data-filter="year">올해</button><button class="filter-chip" data-filter="month">이번달</button></div>
    <div style="overflow:hidden;"><button id="sort-toggle">가입일순 ↕</button></div>
    <div class="card"><div id="ci-att-list"></div></div>
  </div>
</div>

<div id="page-sessions" class="page">
  <div class="card">
    <div class="ct">🗓️ 새 일정 등록</div>
    <select id="pub-sess-cat"><option value="🏃 러닝">🏃 러닝</option><option value="🏔️ 등산">🏔️ 등산</option><option value="🍽️ 식사">🍽️ 식사</option><option value="🏋️ 운동">🏋️ 운동</option><option value="기타">기타</option></select>
    <input type="text" id="pub-sess-name" placeholder="일정 제목"/>
    <input type="date" id="pub-sess-date"/>
    <div style="display:flex; gap:10px;"><input type="time" id="pub-sess-time" placeholder="시작"/><input type="time" id="pub-sess-endtime" placeholder="종료"/></div>
    <input type="text" id="pub-sess-place" placeholder="장소 (예: 미사호수공원)"/>
    <button class="btn-main" id="create-sess-btn">일정 등록하기</button>
  </div>
  <div id="sess-list"></div>
</div>

<div id="page-game" class="page">
  <div class="card"><div class="ct">🏆 이번달 출석왕</div><div id="champion-result" class="game-result">로드 중...</div><button id="kakao-share-champion" class="btn-main btn-kakao" style="display:none;">결과 공유</button></div>
  <div class="card"><div class="ct">🎯 오늘의 룰렛</div><div id="roulette-result" class="game-result">무엇을 해볼까요?</div><button class="btn-main" onclick="spinRoulette()">🎰 룰렛 돌리기</button></div>
  <div class="card"><div class="ct">🎲 팀 랜덤 배정</div><div id="game-member-list" style="max-height:180px; overflow-y:auto; background:var(--surface2); border-radius:12px; padding:10px; margin-bottom:10px;"></div><button class="btn-main" onclick="shuffleTeams()">배정 시작</button><div id="team-result"></div></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw",
  authDomain: "dordo-17766.firebaseapp.com",
  projectId: "dordo-17766",
  storageBucket: "dordo-17766.firebasestorage.app",
  messagingSenderId: "616591115480",
  appId: "1:616591115480:web:ade08d721401f9f6ec03ad"
});
const db = firebase.firestore();
try { Kakao.init('a961440bf90100c6847da5ee2fde06e1'); } catch(e) {}

const ADMIN_PW = "dordo2023";
const USER_NAME_KEY = 'dordo-user-name';
const MATE_ORDER = ['호정/리더', '황윤정/소통메이트', '주동준/운동메이트'];
const JOIN_DATES = { '김병희/덕풍':'230410','성준/미사':'230715','장지연/미사':'230916','왕신민/미사':'231013','김규성/광주':'230730','헤라/광주🐺':'230730','최형규/미사':'240501','주성/미사':'240620','박현정/망월':'250301','김민호/경기광주':'250507','정다운/미사':'250511','양윤석/덕풍':'250512','민연희/미사':'250525','우빛나/미사':'250530','이삭/양평':'250619','은지/미사':'250623','박성민/덕풍':'250804','가은/미사':'250817','도영/덕풍':'250904','큐성/덕풍':'260128','최예인/미사':'260411','이정민/미사':'260422','대훈/덕풍':'260430','원재윤':'260422' };

let ciFilter = 'all', attSortByCount = false;
let _membersCache = null, _sessionsCache = null;

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toast(msg) { const t = document.getElementById('toast-el'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function grade(m) { if (m.role === 'mate') return '🔥'; if (m.count >= 15) return '🦢'; if (m.count >= 5) return '🐥'; return '🐣'; }

async function getMembers(f) { if (_membersCache && !f) return _membersCache; const s = await db.collection('members').get(); _membersCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _membersCache; }
async function getAllSessions(f) { if (_sessionsCache && !f) return _sessionsCache; const s = await db.collection('sessions').orderBy('date','desc').get(); _sessionsCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _sessionsCache; }

function sortMembers(members) {
  return [...members].sort((a, b) => {
    const ai = MATE_ORDER.indexOf(a.name), bi = MATE_ORDER.indexOf(b.name);
    if (ai !== bi) return (ai === -1 ? 1 : bi === -1 ? -1 : ai - bi);
    const ja = a.joined || JOIN_DATES[a.name] || '999999', jb = b.joined || JOIN_DATES[b.name] || '999999';
    return ja.localeCompare(jb);
  });
}

function shareSess(n, d, t, p) {
  if(!window.Kakao || !Kakao.isInitialized()) return;
  Kakao.Share.sendDefault({
    objectType: 'feed',
    content: { title: `[DORDO] ${n}`, description: `📅 날짜: ${d}\n⏰ 시간: ${t || '미정'}\n📍 장소: ${p || '미정'}`, imageUrl: 'https://qoghwjd123-cmyk.github.io/logo.png', link: { mobileWebUrl: location.href, webUrl: location.href } },
    buttons: [{ title: '참석 체크하기', link: { mobileWebUrl: location.href, webUrl: location.href } }]
  });
}

async function renderMPage() {
  const members = await getMembers(); const sorted = sortMembers(members); const myName = localStorage.getItem(USER_NAME_KEY);
  document.getElementById('mlist').innerHTML = sorted.map(m => `<div class="mi ${m.name===myName?'is-me':''}"><div class="av">${grade(m)}</div><div style="flex:1"><div class="mn">${m.name}</div><div class="mm">${m.count||0}회 참석</div></div></div>`).join('');
}

async function renderAttBoard() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  const today = new Date().toISOString().split('T')[0], myName = localStorage.getItem(USER_NAME_KEY);
  let filtered = sessions.filter(s => s.date <= today);
  if (ciFilter === 'year') filtered = filtered.filter(s => s.date.startsWith(today.slice(0,4)));
  if (ciFilter === 'month') filtered = filtered.filter(s => s.date.startsWith(today.slice(0,7)));
  const counts = {}; filtered.forEach(s => (s.attendees||[]).forEach(a => counts[a.memberId] = (counts[a.memberId]||0) + 1));
  let sorted = attSortByCount ? [...members].sort((a,b) => (counts[b.id]||0) - (counts[a.id]||0)) : sortMembers(members);
  const myIdx = sorted.findIndex(m => m.name === myName); if (myIdx > -1) { const [me] = sorted.splice(myIdx, 1); sorted.unshift(me); }
  document.getElementById('ci-att-list').innerHTML = sorted.map(m => {
    const cnt = counts[m.id]||0, pct = filtered.length ? Math.round(cnt/filtered.length*100) : 0;
    return `<div class="mi ${m.name===myName?'is-me':''}"><div class="av">${grade(m)}</div><div style="flex:1"><div style="display:flex; justify-content:space-between;"><div class="mn">${m.name}</div><span class="mm">${cnt}/${filtered.length}회</span></div><div class="att-bar-bg"><div class="att-bar-fill" style="width:${pct}%; background:${m.name===myName?'#000':'var(--accent)'}"></div></div></div><div style="font-weight:700; color:var(--accent); font-size:13px; width:40px; text-align:right;">${pct}%</div></div>`;
  }).join('');
}

async function renderSessionsTab() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  const today = new Date().toISOString().split('T')[0], myName = localStorage.getItem(USER_NAME_KEY);
  document.getElementById('sess-list').innerHTML = sessions.map(s => {
    const isPast = s.date < today, atts = s.attendees || [], me = members.find(m => m.name === myName);
    const isAtt = me && atts.some(a => a.memberId === me.id); const fullTime = s.time ? (s.endtime ? `${s.time}~${s.endtime}` : s.time) : '';
    return `<div class="card"><div style="display:flex; justify-content:space-between;"><b>${s.name}</b><span style="font-size:11px; color:var(--text3);">${isPast?'종료':'예정'}</span></div><div style="font-size:12px; color:var(--text2); margin:5px 0;">${s.cat||'기타'} | ${s.date} ${fullTime}</div>${s.place?`<div style="font-size:12px; color:var(--text3); margin-bottom:8px;">📍 ${s.place}</div>`:''}<div class="att-list-wrap">${atts.map(a => { const m = members.find(mem=>mem.id===a.memberId); return `<span class="att-chip ${m?.name===myName?'is-me':''}">${m?.name.split('/')[0]}</span>`}).join('')}</div>${!isPast && me ? `<button class="btn-main ${isAtt?'btn-sub':''}" onclick="toggleAttend('${s.id}', ${isAtt})">${isAtt?'참석 취소':'참석하기'}</button><button class="btn-main btn-kakao" onclick="shareSess('${s.name}','${s.date}','${fullTime}','${s.place}')">💬 카톡 공유</button>`:''}</div>`;
  }).join('');
}

async function toggleAttend(sid, isAtt) {
  const name = localStorage.getItem(USER_NAME_KEY), members = await getMembers(), me = members.find(x => x.name === name);
  const ref = db.collection('sessions').doc(sid), s = (await ref.get()).data();
  let next = s.attendees || []; if (isAtt) next = next.filter(x => x.memberId !== me.id); else next.push({memberId: me.id});
  await ref.update({ attendees: next }); await db.collection('members').doc(me.id).update({count: isAtt ? (me.count-1) : (me.count+1)});
  _sessionsCache = null; renderSessionsTab();
}

async function init() {
  const name = localStorage.getItem(USER_NAME_KEY);
  if (!name) { 
    const m = await getMembers(); 
    document.getElementById('user-select-list').innerHTML = sortMembers(m).map(x => `<div class="mi" style="cursor:pointer" onclick="setUser('${x.name}')">${grade(x)} ${x.name}</div>`).join('');
    document.getElementById('user-setting-modal').classList.add('open');
  }
  renderMPage();
}

function setUser(n) { localStorage.setItem(USER_NAME_KEY, n); location.reload(); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.nb').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active')); document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active'); document.getElementById('page-'+btn.dataset.page).classList.add('active');
  const p = btn.dataset.page; if(p==='sessions') renderSessionsTab(); if(p==='game') initGameTab(); if(p==='members') renderMPage();
});

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
  document.getElementById('mtab-list').style.display = btn.dataset.mtab==='list'?'block':'none'; document.getElementById('mtab-stats').style.display = btn.dataset.mtab==='stats'?'block':'none';
  if(btn.dataset.mtab==='stats') renderAttBoard();
});

document.getElementById('create-sess-btn').onclick = async () => {
  const n = document.getElementById('pub-sess-name').value, d = document.getElementById('pub-sess-date').value;
  const c = document.getElementById('pub-sess-cat').value, t = document.getElementById('pub-sess-time').value;
  const et = document.getElementById('pub-sess-endtime').value, p = document.getElementById('pub-sess-place').value;
  if(!n||!d) return alert('제목과 날짜를 입력하세요');
  await db.collection('sessions').add({ name:n, date:d, cat:c, time:t, endtime:et, place:p, attendees:[], createdAt:Date.now() });
  toast('등록 완료!'); _sessionsCache=null; renderSessionsTab();
  if(confirm('카카오톡으로 공유하시겠습니까?')) shareSess(n, d, t ? t+(et?`~${et}`:''):'', p);
};

init();
</script>
</body>
</html>
