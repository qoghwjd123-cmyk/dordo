<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f8f9fa; --surface:#fff; --surface2:#efeff0; --border:rgba(0,0,0,.05);
  --text:#1a1a1b; --text2:#666; --text3:#999;
  --accent:#2d6a4f; --accent-l:#e8f5ee; --accent2:#e76f51; --my-highlight: #dfff00;
  --r:20px; --rs:12px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; appearance:none; -webkit-appearance:none;}
body{font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;}
header{background:#1a1a18; padding:1rem; text-align:center; position:sticky; top:0; z-index:200;}
.logo-text{font-family:'Arial Black',sans-serif; font-size:18px; font-weight:900; letter-spacing:1px; color:#F5A623}
.logo-text span{color:#E8162B}

/* 네비게이션 */
.nav{display:flex; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:100; padding:0 0.5rem;}
.nb{flex:1; padding:1rem 0; background:none; border:none; font-size:11px; font-weight:500; color:var(--text3); cursor:pointer; position:relative; transition:0.2s;}
.nb.active{color:var(--accent); font-weight:700;}
.nb.active::after{content:''; position:absolute; bottom:0; left:25%; width:50%; height:3px; background:var(--accent); border-radius:10px 10px 0 0;}

/* 페이지 레이아웃 */
.page{display:none; padding:1.25rem 1rem 5rem; max-width:480px; margin:0 auto;}
.page.active{display:block;}
.card{background:var(--surface); border-radius:var(--rs); padding:1.25rem; border:1px solid var(--border); margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,0.02);}
.ct{font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.875rem}

/* 입력창 스타일 수동 지정 (중요: appearance 무시 방지) */
input, select {
  width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: var(--rs);
  font-family: inherit; font-size: 14px; background: var(--surface2); color: var(--text);
  outline: none; margin-bottom: 0.65rem; transition: border-color 0.2s;
}
input:focus { border-color: var(--accent); background: #fff; }

.tab-container { display:flex; background:var(--surface2); border-radius:100px; padding:4px; margin-bottom:1.5rem; }
.tab-btn { flex:1; padding:8px 0; border:none; border-radius:100px; font-size:13px; font-weight:600; color:var(--text3); background:none; cursor:pointer; }
.tab-btn.active { background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,0.05); }

.filter-group { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:0.8rem; }
.filter-chip { padding:6px 14px; border-radius:100px; border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--text2); cursor:pointer; }
.filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 리스트 및 칩 */
.mi{display:flex; align-items:center; gap:12px; padding:0.8rem 0; border-bottom:1px solid var(--border);}
.mi.is-me { background:var(--my-highlight); border-radius:12px; padding-left:10px; padding-right:10px; border:none; margin:4px 0; }
.av{width:40px; height:40px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:18px;}
.mn{font-size:15px; font-weight:600;}
.mm{font-size:12px; color:var(--text3);}

.att-bar-bg{background:var(--surface2); border-radius:100px; height:8px; width:100%; overflow:hidden; margin-top:6px;}
.att-bar-fill{background:var(--accent); height:100%; border-radius:100px; transition:width 0.6s ease;}

.btn-main { width:100%; padding:0.85rem; border:none; border-radius:var(--rs); font-size:14px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; margin-bottom:0.5rem;}
.btn-sub { width:100%; padding:0.85rem; border:1px solid var(--border); border-radius:var(--rs); font-size:14px; font-weight:700; background:var(--surface2); color:var(--text2); }
.btn-kakao { background:#FEE500; color:#191919; border:none; }

.att-list-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.att-chip { padding: 4px 10px; background: var(--surface2); border-radius: 20px; font-size: 12px; color: var(--text2); font-weight: 500; border: 1px solid var(--border); }
.att-chip.is-me { background: var(--my-highlight); color: #000; font-weight: 700; }

.toast-el{position:fixed; bottom:5rem; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:100px; font-size:13px; opacity:0; transition:0.3s; z-index:999;}
.toast-el.show{opacity:1; bottom:6rem;}

.mb-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; align-items:flex-end; justify-content:center}
.mb-bg.open{display:flex}
.modal{background:var(--surface); border-radius:var(--r) var(--r) 0 0; padding:1.5rem; width:100%; max-width:480px; max-height:85vh; overflow-y:auto}
</style>
</head>
<body>
<header><div class="logo-text">DO<span>R</span>DO</div></header>
<nav class="nav">
  <button class="nb" data-page="rules">📌 회칙</button>
  <button class="nb active" data-page="members">👥 멤버</button>
  <button class="nb" data-page="sessions">📅 일정</button>
  <button class="nb" data-page="game">🎮 게임</button>
  <button class="nb" data-page="admin">🔥 운영진</button>
</nav>

<div id="toast-el" class="toast-el"></div>

<div id="page-rules" class="page">
  <div class="card">
    <div class="ct">운영 지침</div>
    <div style="font-size:14px; line-height:1.7;">📌 별명은 <b>[이름 / 동네]</b> 형식으로 설정 필수!<br>📌 가입 후 2주 이내 인증 모임 참석 필수입니다.</div>
  </div>
</div>

<div id="page-members" class="page active">
  <div class="tab-container">
    <button class="tab-btn active" data-mtab="list">멤버 목록</button>
    <button class="tab-btn" data-mtab="stats">출석 통계</button>
  </div>
  <div id="mtab-list"><div class="card"><div id="mlist"></div></div></div>
  <div id="mtab-stats" style="display:none">
    <div class="filter-group"><button class="filter-chip active" data-filter="all">전체</button><button class="filter-chip" data-filter="year">올해</button><button class="filter-chip" data-filter="month">이번달</button></div>
    <div class="card"><div id="ci-att-list"></div></div>
  </div>
</div>

<div id="page-sessions" class="page">
  <div class="card">
    <div class="ct">🗓️ 새 일정 등록</div>
    
    <div style="font-size:12px; color:var(--text3); margin-bottom:4px;">카테고리</div>
    <select id="pub-sess-cat">
      <option value="🏃 러닝">🏃 러닝</option>
      <option value="🏔️ 등산">🏔️ 등산</option>
      <option value="🍽️ 식사">🍽️ 식사</option>
      <option value="🏋️ 운동">🏋️ 운동</option>
      <option value="기타">기타</option>
    </select>

    <div style="font-size:12px; color:var(--text3); margin-bottom:4px;">일정 제목</div>
    <input type="text" id="pub-sess-name" placeholder="예: 정기 러닝 5K"/>

    <div style="font-size:12px; color:var(--text3); margin-bottom:4px;">날짜</div>
    <input type="date" id="pub-sess-date"/>

    <div style="display:flex; gap:10px;">
      <div style="flex:1;">
        <div style="font-size:12px; color:var(--text3); margin-bottom:4px;">시작 시간</div>
        <input type="time" id="pub-sess-time"/>
      </div>
      <div style="flex:1;">
        <div style="font-size:12px; color:var(--text3); margin-bottom:4px;">종료 시간</div>
        <input type="time" id="pub-sess-endtime"/>
      </div>
    </div>

    <div style="font-size:12px; color:var(--text3); margin-bottom:4px;">장소</div>
    <input type="text" id="pub-sess-place" placeholder="예: 미사호수공원 매점 앞"/>

    <button class="btn-main" id="create-sess-btn" style="margin-top:10px;">일정 등록하기</button>
  </div>
  <div id="sess-list"></div>
</div>

<div id="page-game" class="page">
  <div class="card"><div class="ct">🎮 게임</div><div style="text-align:center; color:var(--text3);">준비 중입니다.</div></div>
</div>

<div id="page-admin" class="page">
  <div id="admin-lock" class="card" style="text-align:center;">
    <div style="font-size:40px; margin-bottom:1rem;">🔒</div>
    <input type="password" id="admin-pw" placeholder="비밀번호" style="text-align:center;"/>
    <button class="btn-main" onclick="checkAdmin()">입장</button>
  </div>
  <div id="admin-content" style="display:none;"><div class="card" id="admin-mlist"></div></div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw",
  authDomain: "dordo-17766.firebaseapp.com",
  projectId: "dordo-17766",
  storageBucket: "dordo-17766.firebasestorage.app",
  messagingSenderId: "616591115480",
  appId: "1:616591115480:web:ade08d721401f9f6ec03ad"
});
const db = firebase.firestore();
const USER_NAME_KEY = 'dordo-user-name';
const MATE_ORDER = ['호정/리더', '황윤정/소통메이트', '주동준/운동메이트'];

let ciFilter = 'all';
let _membersCache = null;
let _sessionsCache = null;

function toast(msg) { const t = document.getElementById('toast-el'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function grade(m) { if (m.role === 'mate') return '🔥'; if (m.count >= 15) return '🦢'; if (m.count >= 5) return '🐥'; return '🐣'; }

async function getMembers(f) { if (_membersCache && !f) return _membersCache; const s = await db.collection('members').get(); _membersCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _membersCache; }
async function getAllSessions(f) { if (_sessionsCache && !f) return _sessionsCache; const s = await db.collection('sessions').orderBy('date','desc').get(); _sessionsCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _sessionsCache; }

function sortMembers(members) {
  return [...members].sort((a, b) => {
    const ai = MATE_ORDER.indexOf(a.name);
    const bi = MATE_ORDER.indexOf(b.name);
    if (ai !== bi) { if (ai === -1) return 1; if (bi === -1) return -1; return ai - bi; }
    return (a.joined || '999999').localeCompare(b.joined || '999999');
  });
}

async function renderMPage() {
  const members = await getMembers();
  const myName = localStorage.getItem(USER_NAME_KEY);
  document.getElementById('mlist').innerHTML = sortMembers(members).map(m => `
    <div class="mi ${m.name===myName?'is-me':''}">
      <div class="av">${grade(m)}</div>
      <div style="flex:1"><div class="mn">${m.name}</div><div class="mm">${m.count||0}회 참석</div></div>
    </div>`).join('');
}

async function renderSessionsTab() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  const today = new Date().toISOString().split('T')[0];
  const myName = localStorage.getItem(USER_NAME_KEY);
  
  document.getElementById('sess-list').innerHTML = sessions.map(s => {
    const isPast = s.date < today;
    const atts = s.attendees || [];
    const isAtt = myName && atts.some(a => {
        const m = members.find(mem => mem.id === a.memberId);
        return m && m.name === myName;
    });

    return `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="font-weight:700; font-size:16px;">${s.name}</div>
          <span style="font-size:11px; padding:2px 8px; border-radius:4px; font-weight:700; background:${isPast?'#eee':'var(--accent-l)'}; color:${isPast?'#999':'var(--accent)'}">${isPast?'종료':'예정'}</span>
        </div>
        <div style="font-size:12px; color:var(--text3); margin:4px 0 10px;">
          ${s.cat || '기타'} | ${s.date} ${s.time ? s.time + (s.endtime ? ' ~ ' + s.endtime : '') : ''}
          ${s.place ? `<br>📍 ${s.place}` : ''}
        </div>
        <div class="ct">참석 (${atts.length}명)</div>
        <div class="att-list-wrap">${atts.map(a => {
            const m = members.find(mem => mem.id === a.memberId);
            return m ? `<span class="att-chip ${m.name===myName?'is-me':''}">${grade(m)} ${m.name.split('/')[0]}</span>` : '';
        }).join('') || '<div style="font-size:12px; color:var(--text3);">참석자가 없습니다.</div>'}</div>
        ${!isPast && myName ? `<button class="btn-main ${isAtt?'btn-sub':''}" onclick="toggleAttend('${s.id}', ${isAtt})">${isAtt?'✓ 참석 완료':'참석하기'}</button>` : ''}
      </div>`;
  }).join('');
}

async function toggleAttend(sid, isAtt) {
  const name = localStorage.getItem(USER_NAME_KEY);
  const me = (await getMembers()).find(x => x.name === name);
  const ref = db.collection('sessions').doc(sid);
  const s = (await ref.get()).data();
  let next = s.attendees || [];
  if (isAtt) {
    next = next.filter(x => x.memberId !== me.id);
    await db.collection('members').doc(me.id).update({count: (me.count||1)-1});
  } else {
    next.push({memberId: me.id, time: new Date().toLocaleTimeString()});
    await db.collection('members').doc(me.id).update({count: (me.count||0)+1});
  }
  await ref.update({ attendees: next });
  _sessionsCache = null; _membersCache = null; renderSessionsTab(); toast('업데이트 완료!');
}

document.getElementById('create-sess-btn').onclick = async () => {
  const name = document.getElementById('pub-sess-name').value;
  const date = document.getElementById('pub-sess-date').value;
  const cat = document.getElementById('pub-sess-cat').value;
  const time = document.getElementById('pub-sess-time').value;
  const endtime = document.getElementById('pub-sess-endtime').value;
  const place = document.getElementById('pub-sess-place').value;
  
  if(!name || !date) return toast('제목과 날짜를 입력하세요.');
  
  await db.collection('sessions').add({
    name, date, cat, time, endtime, place,
    attendees: [], createdAt: Date.now()
  });
  
  _sessionsCache = null; renderSessionsTab(); 
  toast('일정이 등록되었습니다! 🎉');
  
  // 입력창 초기화
  document.getElementById('pub-sess-name').value = '';
  document.getElementById('pub-sess-place').value = '';
};

// 탭 전환 로직
document.querySelectorAll('.nb').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+btn.dataset.page).classList.add('active');
  if(btn.dataset.page === 'sessions') renderSessionsTab();
  if(btn.dataset.page === 'members') renderMPage();
});

renderMPage();
</script>
</body>
</html>
