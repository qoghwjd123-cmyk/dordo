<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<meta property="og:title" content="DORDO 두알두"/>
<meta property="og:description" content="두알두 러닝 모임 — 일정 참석 및 출석 현황"/>
<meta property="og:image" content="https://qoghwjd123-cmyk.github.io/logo.png"/>
<meta property="og:url" content="https://qoghwjd123-cmyk.github.io/dordo"/>
<meta property="og:type" content="website"/>
<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,.08);
  --text:#1a1a18;--text2:#6b6b65;--text3:#a0a09a;
  --accent:#2d6a4f;--accent-l:#e8f5ee;--accent2:#e76f51;--accent2-l:#fdf0ec;
  --my-highlight: #dfff00; 
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#1a1a18;padding:.55rem 1rem;display:flex;align-items:center;justify-content:center}
.logo-text{font-family:'Arial Black','Arial',sans-serif;font-size:20px;font-weight:900;letter-spacing:2px;color:#F5A623}
.logo-text span{color:#E8162B}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 .5rem;position:sticky;top:0;z-index:100}
.nb{flex:1;padding:.85rem .3rem;background:none;border:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.nb.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:1.25rem 1rem 5rem;max-width:480px;margin:0 auto}
.page.active{display:block}

/* 개인화 웰컴 박스 */
.welcome-container { padding: 1.25rem 1rem 0; max-width: 480px; margin: 0 auto; }
.welcome-box { background: var(--surface); border-radius: var(--rs); padding: 1rem; border: 1px solid var(--border); display: none; align-items: center; justify-content: space-between; }
.welcome-text { font-size: 14px; font-weight: 700; color: var(--accent); }
.welcome-reset { font-size: 11px; color: var(--text3); cursor: pointer; text-decoration: underline; }

/* 일정 카드 내 체크 박스 */
.my-check-box { background: var(--accent-l); border-radius: 12px; padding: 1.25rem; margin-top: 1rem; text-align: center; border: 1px solid var(--accent); }
.my-check-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 0.75rem; }
.my-check-btns { display: flex; gap: 8px; }
.btn-rsvp { flex: 1; padding: 0.75rem; border-radius: 8px; border: none; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn-rsvp.join { background: var(--accent); color: #fff; }
.btn-rsvp.absent { background: #fee2e2; color: #991b1b; }
.btn-rsvp.active-join { background: var(--accent); color: #fff; box-shadow: 0 0 0 3px var(--accent-l); }
.btn-rsvp.active-absent { background: #991b1b; color: #fff; box-shadow: 0 0 0 3px #fee2e2; }

/* 공통 스타일 */
.card{background:var(--surface);border-radius:var(--r);padding:1.25rem;border:1px solid var(--border);margin-bottom:1rem; position:relative;}
.ct{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.875rem}
input,select{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:15px;color:var(--text);background:var(--surface2);outline:none;margin-bottom:.65rem;box-sizing:border-box}
.btn{width:100%;padding:.85rem;border:none;border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;}
.bp{background:var(--accent);color:#fff}
.bs{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.mi{display:flex;align-items:center;gap:10px;padding:.65rem 0;border-bottom:1px solid var(--border)}
.mi.is-me { background: var(--my-highlight) !important; border: 1.5px solid #bfff00 !important; border-radius: 12px; margin: 4px 0; padding-left: 8px; padding-right: 8px; }
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mn{font-size:14px;font-weight:500;}
.mm{font-size:12px;color:var(--text3);margin-top:1px}
.gp{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;background:var(--surface2);color:var(--text3);white-space:nowrap}
.gp.green{background:var(--accent-l);color:var(--accent)}

/* 출석 바 */
.att-bar-bg{background:var(--surface2);border-radius:4px;height:6px;width:100%;overflow:hidden;margin-top:4px;}
.att-bar-fill{background:var(--accent);height:6px;border-radius:4px;transition: width 0.5s ease;}

/* 카테고리 배지 */
.cat-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap}
.cat-badge.run{background:#e8f5ee;color:#1a6b3c}
.cat-badge.hike{background:#e8f0fb;color:#1a4a9e}
.cat-badge.eat{background:#fdf0ec;color:#b84c1a}
.cat-badge.etc{background:#f0efe9;color:#6b6b65}
.cat-badge.workout{background:#f3e8fb;color:#6b21a8}

/* 이름 칩 */
.att-list-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.att-chip { padding: 4px 10px; background: var(--surface2); border-radius: 20px; font-size: 12px; color: var(--text2); font-weight: 500; border: 1px solid var(--border); display:flex; align-items:center; gap:4px;}
.att-chip.is-me { background: var(--my-highlight); color: #000; border-color: #bfff00; font-weight: 700; }

.toast-el{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(300px);background:#1a1a18;color:#fff;padding:.7rem 1.4rem;border-radius:100px;font-size:14px;z-index:999;opacity:0;transition:all .3s;}
.toast-el.show{transform:translateX(-50%) translateY(0);opacity:1}
.mb-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.mb-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:1.5rem;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
</style>
</head>
<body>
<header><div class="logo-text">DO<span>R</span>DO</div></header>
<nav class="nav">
  <button class="nb" data-page="rules">📌 두알두</button>
  <button class="nb active" data-page="members">👥 멤버</button>
  <button class="nb" data-page="sessions">📅 일정</button>
  <button class="nb" data-page="game">🎮 게임</button>
</nav>

<div class="welcome-container">
  <div id="welcome-box" class="welcome-box">
    <div class="welcome-text" id="welcome-text"></div>
    <div class="welcome-reset" onclick="resetUser()">이름 변경</div>
  </div>
</div>

<div id="toast-el" class="toast-el"></div>

<div class="mb-bg" id="user-setting-modal" style="z-index:1000">
  <div class="modal">
    <div style="font-size:16px; font-weight:700; margin-bottom:1rem;">👋 반가워요! 누구신가요?</div>
    <div style="font-size:13px; color:var(--text2); margin-bottom:1rem;">이름을 선택하면 일정 참석 체크가 더 편해져요.</div>
    <div id="user-select-list" style="max-height:50vh; overflow-y:auto; margin-bottom:1rem;"></div>
    <button class="btn bs" onclick="closeModal('user-setting-modal')">나중에 하기</button>
  </div>
</div>

<div id="page-rules" class="page">
  <div class="card">
    <div class="ct">운영 회칙</div>
    <div style="font-size:14px; line-height:1.6">별명은 [이름 / 동네] 형식으로 설정해주세요.<br>신규 멤버는 2주 이내 인증 필수입니다.</div>
  </div>
</div>

<div id="page-members" class="page active">
  <div class="filter-tabs" style="margin-bottom:1rem">
    <button class="mtab active" data-mtab="list">👥 멤버 목록</button>
    <button class="mtab" data-mtab="stats">📊 출석 통계</button>
  </div>

  <div id="mtab-list">
    <div id="mlist"></div>
  </div>

  <div id="mtab-stats" style="display:none">
    <div class="filter-tabs" style="margin-bottom:.5rem; flex-wrap:wrap; gap:4px">
      <button class="ftab active" data-filter="all">전체</button>
      <button class="ftab" data-filter="year">올해</button>
      <button class="ftab" data-filter="month">이번달</button>
    </div>
    <div class="filter-tabs" style="margin-bottom:1rem; flex-wrap:wrap; gap:4px">
      <button class="cat-tab active" data-cat="all">전체</button>
      <button class="cat-tab" data-cat="🏃 러닝">🏃 러닝</button>
      <button class="cat-tab" data-cat="🏔️ 등산">🏔️ 등산</button>
      <button class="cat-tab" data-cat="🍽️ 식사">🍽️ 식사</button>
      <button class="cat-tab" data-cat="🏋️ 운동">🏋️ 운동</button>
    </div>
    <div id="ci-att-list"></div>
  </div>
</div>

<div id="page-sessions" class="page">
  <div id="sess-list"></div>
</div>

<script>
// 카카오 SDK 초기화
try { Kakao.init('a961440bf90100c6847da5ee2fde06e1'); } catch(e) {}

firebase.initializeApp({
  apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw",
  authDomain: "dordo-17766.firebaseapp.com",
  projectId: "dordo-17766",
  storageBucket: "dordo-17766.firebasestorage.app",
  messagingSenderId: "616591115480",
  appId: "1:616591115480:web:ade08d721401f9f6ec03ad"
});
const db = firebase.firestore();
const USER_NAME_KEY = 'dordo-user-name';
let _membersCache = null;
let _sessionsCache = null;
let ciFilter = 'all';
let catFilter = 'all';

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toast(msg) { const t = document.getElementById('toast-el'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

function grade(m) { if (m.role === 'mate') return {e:'🔥', n:'메이트'}; if (m.count >= 15) return {e:'🦢', n:'베테랑'}; if (m.count >= 5) return {e:'🐥', n:'활동'}; return {e:'🐣', n:'새내기'}; }

async function getMembers(f) { if (_membersCache && !f) return _membersCache; const s = await db.collection('members').get(); _membersCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _membersCache; }
async function getAllSessions(f) { if (_sessionsCache && !f) return _sessionsCache; const s = await db.collection('sessions').orderBy('date','desc').get(); _sessionsCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _sessionsCache; }

// 개인화 로직
async function initUser() {
  const name = localStorage.getItem(USER_NAME_KEY);
  if (name) {
    document.getElementById('welcome-box').style.display = 'flex';
    document.getElementById('welcome-text').textContent = `${name.split('/')[0]}님 환영해요! 🔥`;
  } else {
    document.getElementById('welcome-box').style.display = 'none';
    setTimeout(async () => {
      const m = await getMembers();
      document.getElementById('user-select-list').innerHTML = m.map(x => `<div class="mi" style="cursor:pointer; padding:0.5rem" onclick="setUser('${x.name}')">${grade(x).e} ${x.name}</div>`).join('');
      document.getElementById('user-setting-modal').classList.add('open');
    }, 1000);
  }
}
function setUser(n) { localStorage.setItem(USER_NAME_KEY, n); closeModal('user-setting-modal'); initUser(); renderMPage(); toast(`${n.split('/')[0]}님 반가워요!`); }
function resetUser() { localStorage.removeItem(USER_NAME_KEY); location.reload(); }

async function renderMPage() {
  const [m, s] = await Promise.all([getMembers(), getAllSessions()]);
  const myName = localStorage.getItem(USER_NAME_KEY);
  document.getElementById('mlist').innerHTML = m.map(x => {
    const isMe = x.name === myName;
    return `<div class="mi ${isMe?'is-me':''}"><div class="av">${grade(x).e}</div><div style="flex:1"><div class="mn">${x.name}${isMe?' (나)':''}</div><div class="mm">${x.count}회 참석</div></div></div>`;
  }).join('');
  if (document.getElementById('mtab-stats').style.display !== 'none') renderAttBoard();
}

async function renderAttBoard() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  const today = new Date().toISOString().split('T')[0];
  const myName = localStorage.getItem(USER_NAME_KEY);
  
  let fs = sessions.filter(s => s.date <= today);
  if (ciFilter === 'year') fs = fs.filter(s => s.date.startsWith(today.slice(0,4)));
  if (ciFilter === 'month') fs = fs.filter(s => s.date.startsWith(today.slice(0,7)));
  if (catFilter !== 'all') fs = fs.filter(s => s.cat === catFilter);

  const countMap = {};
  fs.forEach(s => (s.attendees||[]).forEach(a => countMap[a.memberId] = (countMap[a.memberId]||0) + 1));
  
  document.getElementById('ci-att-list').innerHTML = members.map(m => {
    const cnt = countMap[m.id]||0; 
    const pct = fs.length ? Math.round(cnt/fs.length*100) : 0; 
    const isMe = m.name === myName;
    return `
      <div class="mi ${isMe?'is-me':''}">
        <div class="av">${grade(m).e}</div>
        <div style="flex:1">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="mn">${m.name}</div>
            <span style="font-size:11px; color:var(--text3)">${cnt}/${fs.length}회</span>
          </div>
          <div class="att-bar-bg"><div class="att-bar-fill" style="width:${pct}%; background:${isMe?'#000':'var(--accent)'}"></div></div>
        </div>
        <span class="gp ${pct>0?'green':''}" style="margin-left:10px">${pct}%</span>
      </div>`;
  }).join('');
}

async function renderSessionsTab() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  const today = new Date().toISOString().split('T')[0];
  const myName = localStorage.getItem(USER_NAME_KEY);
  
  document.getElementById('sess-list').innerHTML = sessions.map(s => {
    const isPast = s.date < today;
    const atts = s.attendees || [];
    const isAtt = atts.some(a => {
        const m = members.find(mem => mem.id === a.memberId);
        return m && m.name === myName;
    });
    const isAbs = (s.absentees||[]).some(id => {
        const m = members.find(mem => mem.id === id);
        return m && m.name === myName;
    });

    const getNameChips = () => {
      if (atts.length === 0) return `<div style="font-size:12px; color:var(--text3); padding:4px 0;">참석자를 기다리고 있어요! 🏃</div>`;
      return atts.map(a => {
        const m = members.find(mem => mem.id === a.memberId);
        if (!m) return '';
        return `<span class="att-chip ${m.name === myName ? 'is-me' : ''}">${grade(m).e} ${m.name.split('/')[0]}</span>`;
      }).join('');
    };

    return `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
           <div style="font-weight:700; font-size:16px;">${s.name}</div>
           <span style="font-size:11px; padding:2px 8px; border-radius:4px; font-weight:700; background:${isPast?'#eee':'var(--accent-l)'}; color:${isPast?'#999':'var(--accent)'}">${isPast?'종료':'예정'}</span>
        </div>
        <div style="font-size:12px; color:var(--text3); margin-bottom:12px;">
          ${s.cat ? `<span class="cat-badge run">${s.cat}</span>` : ''} ${s.date} ${s.time || ''}
        </div>
        
        <div class="ct" style="margin-bottom:8px">참석 현황 (${atts.length}명)</div>
        <div class="att-list-wrap">${getNameChips()}</div>

        ${!isPast && myName ? `
          <div class="my-check-box">
            <div class="my-check-title">${myName.split('/')[0]}님, 참석하시나요? 🔥</div>
            <div class="my-check-btns">
              <button class="btn-rsvp join ${isAtt?'active-join':''}" onclick="doAttend('${s.id}','${isAtt}')">${isAtt?'✓ 참석완료':'참석'}</button>
              <button class="btn-rsvp absent ${isAbs?'active-absent':''}" onclick="doAbsent('${s.id}','${isAbs}')">${isAbs?'✗ 불참완료':'불참'}</button>
            </div>
          </div>
          <button class="btn bs" style="margin-top:10px; background:#FEE500; color:#191919; border:none;" onclick="shareSess('${s.name}','${s.date}')">💬 카카오톡 공유</button>
        ` : ''}
      </div>`;
  }).join('');
}

window.doAttend = async (sid, isAlready) => {
  const name = localStorage.getItem(USER_NAME_KEY);
  const m = (await getMembers()).find(x => x.name === name);
  if (!m) return;
  const ref = db.collection('sessions').doc(sid);
  const s = (await ref.get()).data();
  let next = s.attendees || [];
  if (isAlready === 'true') {
    next = next.filter(x => x.memberId !== m.id);
    await db.collection('members').doc(m.id).update({count: (m.count||1)-1});
  } else {
    next.push({memberId: m.id, time: new Date().toLocaleTimeString()});
    await ref.update({ absentees: (s.absentees||[]).filter(id => id !== m.id) });
    await db.collection('members').doc(m.id).update({count: (m.count||0)+1});
  }
  await ref.update({ attendees: next });
  _sessionsCache = null; _membersCache = null; renderSessionsTab(); toast('업데이트 완료!');
};

window.doAbsent = async (sid, isAlready) => {
    const name = localStorage.getItem(USER_NAME_KEY);
    const m = (await getMembers()).find(x => x.name === name);
    if (!m) return;
    const ref = db.collection('sessions').doc(sid);
    const s = (await ref.get()).data();
    let nextAbs = s.absentees || [];
    if (isAlready === 'true') {
        nextAbs = nextAbs.filter(id => id !== m.id);
    } else {
        nextAbs.push(m.id);
        const nextAtt = (s.attendees||[]).filter(x => x.memberId !== m.id);
        if (nextAtt.length !== (s.attendees||[]).length) {
            await db.collection('members').doc(m.id).update({count: (m.count||1)-1});
        }
        await ref.update({ attendees: nextAtt });
    }
    await ref.update({ absentees: nextAbs });
    _sessionsCache = null; _membersCache = null; renderSessionsTab(); toast('업데이트 완료!');
};

function shareSess(n, d) {
    Kakao.Share.sendDefault({
        objectType: 'feed',
        content: { title: `[DORDO] ${n}`, description: `${d} 모임 함께해요!`, imageUrl: 'https://qoghwjd123-cmyk.github.io/logo.png', link: { mobileWebUrl: location.href, webUrl: location.href } },
        buttons: [{ title: '참석하러 가기', link: { mobileWebUrl: location.href, webUrl: location.href } }]
    });
}

// 탭 이벤트
document.querySelectorAll('.nb').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+btn.dataset.page).classList.add('active');
  if(btn.dataset.page === 'sessions') renderSessionsTab();
  if(btn.dataset.page === 'members') renderMPage();
});

document.querySelectorAll('.mtab').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.mtab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = btn.dataset.mtab;
  document.getElementById('mtab-list').style.display = t === 'list' ? 'block' : 'none';
  document.getElementById('mtab-stats').style.display = t === 'stats' ? 'block' : 'none';
  if(t === 'stats') renderAttBoard();
});

document.querySelectorAll('.ftab').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ciFilter = btn.dataset.filter;
  renderAttBoard();
});

document.querySelectorAll('.cat-tab').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  catFilter = btn.dataset.cat;
  renderAttBoard();
});

initUser();
renderMPage();
</script>
</body>
</html>
