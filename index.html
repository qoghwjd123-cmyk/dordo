<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f8f9fa; --surface:#fff; --surface2:#efeff0; --border:rgba(0,0,0,.05);
  --text:#1a1a1b; --text2:#666; --text3:#999;
  --accent:#2d6a4f; --accent-l:#e8f5ee; --accent2:#e76f51; --my-highlight: #dfff00;
  --r:20px; --rs:12px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; appearance:none; -webkit-appearance:none;}
body{font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;}
header{background:#1a1a18; padding:1rem; text-align:center; position:sticky; top:0; z-index:200;}
.logo-text{font-family:'Arial Black',sans-serif; font-size:18px; font-weight:900; letter-spacing:1px; color:#F5A623}
.logo-text span{color:#E8162B}

/* 네비게이션 */
.nav{display:flex; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:100; padding:0 0.5rem;}
.nb{flex:1; padding:1rem 0; background:none; border:none; font-size:12px; font-weight:500; color:var(--text3); cursor:pointer; position:relative; transition:0.2s;}
.nb.active{color:var(--accent); font-weight:700;}
.nb.active::after{content:''; position:absolute; bottom:0; left:25%; width:50%; height:3px; background:var(--accent); border-radius:10px 10px 0 0;}

/* 페이지 레이아웃 */
.page{display:none; padding:1.25rem 1rem 5rem; max-width:480px; margin:0 auto;}
.page.active{display:block;}
.card{background:var(--surface); border-radius:var(--rs); padding:1.25rem; border:1px solid var(--border); margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,0.02);}
.ct{font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.875rem}

/* 탭 및 필터 */
.tab-container { display:flex; background:var(--surface2); border-radius:100px; padding:4px; margin-bottom:1.5rem; }
.tab-btn { flex:1; padding:8px 0; border:none; border-radius:100px; font-size:13px; font-weight:600; color:var(--text3); background:none; cursor:pointer; transition:0.2s; }
.tab-btn.active { background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,0.05); }

.filter-group { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:1rem; }
.filter-chip { padding:6px 14px; border-radius:100px; border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--text2); font-weight:500; cursor:pointer; }
.filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 리스트 항목 */
.mi{display:flex; align-items:center; gap:12px; padding:0.8rem 0; border-bottom:1px solid var(--border);}
.mi.is-me { background:var(--my-highlight); border-radius:12px; padding-left:10px; padding-right:10px; border:none; }
.av{width:40px; height:40px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:18px;}
.mn{font-size:15px; font-weight:600;}
.mm{font-size:12px; color:var(--text3);}

/* 출석 바 */
.att-bar-bg{background:var(--surface2); border-radius:100px; height:8px; width:100%; overflow:hidden; margin-top:6px;}
.att-bar-fill{background:var(--accent); height:100%; border-radius:100px; transition:width 0.6s ease;}

/* 버튼 */
.btn-main { width:100%; padding:0.85rem; border:none; border-radius:var(--rs); font-size:15px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; margin-bottom:0.5rem;}
.btn-sub { width:100%; padding:0.85rem; border:1px solid var(--border); border-radius:var(--rs); font-size:15px; font-weight:700; cursor:pointer; background:var(--surface2); color:var(--text2); }
.btn-kakao { background:#FEE500; color:#191919; border:none; }

/* 웰컴 박스 */
.welcome-box { background:var(--accent); border-radius:var(--rs); padding:1.25rem; color:#fff; display:none; align-items:center; justify-content:space-between; margin:1rem auto 0; max-width:480px; }
.welcome-reset { font-size:11px; opacity:0.8; text-decoration:underline; cursor:pointer; }

/* 일정 명단 칩 */
.att-list-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.att-chip { padding: 4px 10px; background: var(--surface2); border-radius: 20px; font-size: 12px; color: var(--text2); font-weight: 500; border: 1px solid var(--border); }
.att-chip.is-me { background: var(--my-highlight); color: #000; font-weight: 700; }

.toast-el{position:fixed; bottom:5rem; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:100px; font-size:14px; opacity:0; transition:0.3s; z-index:999;}
.toast-el.show{opacity:1; bottom:6rem;}

/* 모달 */
.mb-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; align-items:flex-end; justify-content:center}
.mb-bg.open{display:flex}
.modal{background:var(--surface); border-radius:var(--r) var(--r) 0 0; padding:1.5rem; width:100%; max-width:480px; max-height:85vh; overflow-y:auto}

/* 게임 결과 */
.game-result { text-align:center; padding:1.5rem 0; font-size:24px; font-weight:700; color:var(--accent); min-height:80px; display:flex; align-items:center; justify-content:center; flex-direction:column; }
</style>
</head>
<body>
<header><div class="logo-text">DO<span>R</span>DO</div></header>
<nav class="nav">
  <button class="nb" data-page="rules">📌 회칙</button>
  <button class="nb active" data-page="members">👥 멤버</button>
  <button class="nb" data-page="sessions">📅 일정</button>
  <button class="nb" data-page="game">🎮 게임</button>
  <button class="nb" data-page="admin">🔥 운영진</button>
</nav>

<div class="welcome-box" id="welcome-box">
  <div style="font-weight:700; font-size:15px;" id="welcome-text"></div>
  <div class="welcome-reset" onclick="resetUser()">이름 변경</div>
</div>

<div id="toast-el" class="toast-el"></div>

<div class="mb-bg" id="user-setting-modal">
  <div class="modal">
    <div style="font-size:16px; font-weight:700; margin-bottom:1rem;">👋 누구신가요?</div>
    <div id="user-select-list" style="max-height:50vh; overflow-y:auto; margin-bottom:1rem;"></div>
    <button class="btn-sub" onclick="closeModal('user-setting-modal')">나중에 하기</button>
  </div>
</div>

<div id="page-rules" class="page">
  <div class="card">
    <div class="ct">운영 회칙</div>
    <div style="font-size:14px; line-height:1.7;">
      📌 별명은 <b>[이름 / 동네]</b> 형식으로 설정해주세요.<br>
      📌 신규 멤버는 가입 후 2주 이내 인증 필수입니다.<br>
      📌 매주 목요일 정기 모임은 밤 9시부터 시작합니다.
    </div>
  </div>
</div>

<div id="page-members" class="page active">
  <div class="tab-container">
    <button class="tab-btn active" data-mtab="list">멤버 목록</button>
    <button class="tab-btn" data-mtab="stats">출석 통계</button>
  </div>

  <div id="mtab-list">
    <div class="card"><div id="mlist"></div></div>
  </div>

  <div id="mtab-stats" style="display:none">
    <div class="filter-group">
      <button class="filter-chip active" data-filter="all">전체 기간</button>
      <button class="filter-chip" data-filter="year">올해</button>
      <button class="filter-chip" data-filter="month">이번달</button>
    </div>
    <div class="card"><div id="ci-att-list"></div></div>
  </div>
</div>

<div id="page-sessions" class="page">
  <div class="card">
    <div class="ct">새 일정 등록</div>
    <input type="text" id="pub-sess-name" placeholder="일정 이름"/>
    <input type="date" id="pub-sess-date"/>
    <button class="btn-main" id="create-sess-btn">일정 등록</button>
  </div>
  <div id="sess-list"></div>
</div>

<div id="page-game" class="page">
  <div class="card">
    <div class="ct">🏆 이번달 출석왕</div>
    <div id="champion-result" class="game-result">데이터를 불러오는 중...</div>
    <button id="kakao-share-champion" class="btn-main btn-kakao" style="display:none;">결과 공유하기</button>
  </div>

  <div class="card">
    <div class="ct">🎯 오늘의 룰렛</div>
    <div id="roulette-result" class="game-result">버튼을 눌러보세요!</div>
    <button class="btn-main" onclick="spinRoulette()">🎰 뽑기!</button>
  </div>

  <div class="card">
    <div class="ct">🎲 팀 배정 / 추첨</div>
    <div style="font-size:13px; color:var(--text2); margin-bottom:10px;">참여 멤버를 선택하고 팀 수를 정하세요.</div>
    <div id="game-member-list" style="max-height:150px; overflow-y:auto; background:var(--surface2); border-radius:12px; padding:10px; margin-bottom:10px;"></div>
    <select id="team-count" style="margin-bottom:10px;"><option value="2">2팀으로 배정</option><option value="3">3팀으로 배정</option></select>
    <button class="btn-main" onclick="shuffleTeams()">🎲 팀 배정하기</button>
    <div id="team-result" style="margin-top:10px;"></div>
  </div>
</div>

<div id="page-admin" class="page">
  <div id="admin-lock" class="card" style="text-align:center;">
    <div style="font-size:40px; margin-bottom:1rem;">🔒</div>
    <div style="font-weight:700; margin-bottom:1rem;">운영진 전용 페이지</div>
    <input type="password" id="admin-pw" placeholder="비밀번호" style="text-align:center;"/>
    <button class="btn-main" onclick="checkAdmin()">입장하기</button>
  </div>
  
  <div id="admin-content" style="display:none;">
    <div class="card">
      <div class="ct">일정 관리</div>
      <div id="admin-sess-list"></div>
    </div>
    <div class="card">
      <div class="ct">멤버 관리</div>
      <div id="admin-mlist"></div>
    </div>
  </div>
</div>

<script>
// Firebase 및 카카오 초기화
firebase.initializeApp({
  apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw",
  authDomain: "dordo-17766.firebaseapp.com",
  projectId: "dordo-17766",
  storageBucket: "dordo-17766.firebasestorage.app",
  messagingSenderId: "616591115480",
  appId: "1:616591115480:web:ade08d721401f9f6ec03ad"
});
const db = firebase.firestore();
try { Kakao.init('a961440bf90100c6847da5ee2fde06e1'); } catch(e) {}

const ADMIN_PW = "dordo2023";
const USER_NAME_KEY = 'dordo-user-name';
let _membersCache = null;
let _sessionsCache = null;
let ciFilter = 'all';

// 유틸리티
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toast(msg) { const t = document.getElementById('toast-el'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
function grade(m) { if (m.role === 'mate') return '🔥'; if (m.count >= 15) return '🦢'; if (m.count >= 5) return '🐥'; return '🐣'; }

async function getMembers(f) { if (_membersCache && !f) return _membersCache; const s = await db.collection('members').get(); _membersCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _membersCache; }
async function getAllSessions(f) { if (_sessionsCache && !f) return _sessionsCache; const s = await db.collection('sessions').orderBy('date','desc').get(); _sessionsCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _sessionsCache; }

// 페이지 초기화
async function init() {
  const name = localStorage.getItem(USER_NAME_KEY);
  if (name) {
    document.getElementById('welcome-box').style.display = 'flex';
    document.getElementById('welcome-text').textContent = `${name.split('/')[0]}님 환영해요! 🔥`;
  } else {
    setTimeout(async () => {
      const m = await getMembers();
      document.getElementById('user-select-list').innerHTML = m.map(x => `<div class="mi" style="cursor:pointer" onclick="setUser('${x.name}')">${grade(x)} ${x.name}</div>`).join('');
      document.getElementById('user-setting-modal').classList.add('open');
    }, 1000);
  }
  renderMPage();
}

function setUser(n) { localStorage.setItem(USER_NAME_KEY, n); location.reload(); }
function resetUser() { localStorage.removeItem(USER_NAME_KEY); location.reload(); }

// 멤버 및 통계 렌더링
async function renderMPage() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  const myName = localStorage.getItem(USER_NAME_KEY);
  
  // 멤버 목록
  document.getElementById('mlist').innerHTML = members.map(m => `
    <div class="mi ${m.name===myName?'is-me':''}">
      <div class="av">${grade(m)}</div>
      <div style="flex:1"><div class="mn">${m.name}</div><div class="mm">${m.count||0}회 참석</div></div>
    </div>`).join('');

  // 통계
  const today = new Date().toISOString().split('T')[0];
  let filtered = sessions.filter(s => s.date <= today);
  if (ciFilter === 'year') filtered = filtered.filter(s => s.date.startsWith(today.slice(0,4)));
  if (ciFilter === 'month') filtered = filtered.filter(s => s.date.startsWith(today.slice(0,7)));

  const countMap = {};
  filtered.forEach(s => (s.attendees||[]).forEach(a => countMap[a.memberId] = (countMap[a.memberId]||0) + 1));

  document.getElementById('ci-att-list').innerHTML = members.map(m => {
    const cnt = countMap[m.id]||0;
    const pct = filtered.length ? Math.round(cnt/filtered.length*100) : 0;
    return `<div class="mi ${m.name===myName?'is-me':''}">
      <div class="av">${grade(m)}</div>
      <div style="flex:1">
        <div style="display:flex; justify-content:space-between; align-items:center;"><div class="mn">${m.name}</div><span class="mm">${cnt}/${filtered.length}회</span></div>
        <div class="att-bar-bg"><div class="att-bar-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`;
  }).join('');
}

// 일정 렌더링
async function renderSessionsTab() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  const today = new Date().toISOString().split('T')[0];
  const myName = localStorage.getItem(USER_NAME_KEY);
  
  document.getElementById('sess-list').innerHTML = sessions.map(s => {
    const isPast = s.date < today;
    const atts = s.attendees || [];
    const me = members.find(m => m.name === myName);
    const isAtt = me && atts.some(a => a.memberId === me.id);
    
    const chips = atts.map(a => {
      const m = members.find(mem => mem.id === a.memberId);
      return m ? `<span class="att-chip ${m.name===myName?'is-me':''}">${grade(m)} ${m.name.split('/')[0]}</span>` : '';
    }).join('');

    return `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div style="font-weight:700; font-size:16px;">${s.name}</div>
          <span style="font-size:11px; padding:2px 8px; border-radius:4px; font-weight:700; background:${isPast?'#eee':'var(--accent-l)'}; color:${isPast?'#999':'var(--accent)'}">${isPast?'종료':'예정'}</span>
        </div>
        <div style="font-size:12px; color:var(--text3); margin-bottom:12px;">${s.date}</div>
        <div class="ct">참석 현황 (${atts.length}명)</div>
        <div class="att-list-wrap">${chips || '<div style="font-size:12px; color:var(--text3);">참석자가 없습니다.</div>'}</div>
        ${!isPast && me ? `
          <div class="my-check-box">
            <div class="my-check-title">${me.name.split('/')[0]}님, 참석하시나요?</div>
            <button class="btn-main ${isAtt?'':'btn-sub'}" onclick="toggleAttend('${s.id}', ${isAtt})">${isAtt?'✓ 참석 완료':'참석하기'}</button>
          </div>
          <button class="btn-main btn-kakao" onclick="shareSess('${s.name}','${s.date}')">카톡 공유</button>
        `:''}
      </div>`;
  }).join('');
}

async function toggleAttend(sid, isAtt) {
  const name = localStorage.getItem(USER_NAME_KEY);
  const me = (await getMembers()).find(x => x.name === name);
  const ref = db.collection('sessions').doc(sid);
  const s = (await ref.get()).data();
  let next = s.attendees || [];
  if (isAtt) {
    next = next.filter(x => x.memberId !== me.id);
    await db.collection('members').doc(me.id).update({count: (me.count||1)-1});
  } else {
    next.push({memberId: me.id, time: new Date().toLocaleTimeString()});
    await db.collection('members').doc(me.id).update({count: (me.count||0)+1});
  }
  await ref.update({ attendees: next });
  _sessionsCache = null; _membersCache = null; renderSessionsTab(); toast('업데이트 완료!');
}

// 게임 탭 로직
async function initGameTab() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  
  // 출석왕
  const thisMonth = new Date().toISOString().slice(0,7);
  const fs = sessions.filter(s => s.date.startsWith(thisMonth));
  const counts = {};
  fs.forEach(s => (s.attendees||[]).forEach(a => counts[a.memberId] = (counts[a.memberId]||0) + 1));
  const ranked = members.map(m => ({...m, mc: counts[m.id]||0})).sort((a,b) => b.mc - a.mc);
  
  if (ranked[0].mc > 0) {
    document.getElementById('champion-result').innerHTML = `👑 ${ranked[0].name} (${ranked[0].mc}회)`;
    document.getElementById('kakao-share-champion').style.display = 'block';
  }

  // 팀 배정 멤버 리스트
  document.getElementById('game-member-list').innerHTML = members.map(m => `
    <label style="display:block; margin:5px 0; font-size:14px;">
      <input type="checkbox" class="team-cb" value="${m.id}" data-name="${m.name}"> ${grade(m)} ${m.name}
    </label>`).join('');
}

function spinRoulette() {
  const options = ['3km 러닝', '5km 러닝', '스쿼트 50개', '플랭크 2분', '휴식!', '등산'];
  const res = document.getElementById('roulette-result');
  let count = 0;
  const inv = setInterval(() => {
    res.textContent = options[Math.floor(Math.random()*options.length)];
    if (++count > 15) { clearInterval(inv); res.style.color = 'var(--accent2)'; }
  }, 100);
}

function shuffleTeams() {
  const selected = [...document.querySelectorAll('.team-cb:checked')].map(cb => cb.dataset.name);
  if (selected.length < 2) return toast('2명 이상 선택하세요');
  const count = document.getElementById('team-count').value;
  const shuffled = selected.sort(() => Math.random() - 0.5);
  const teams = Array.from({length: count}, () => []);
  shuffled.forEach((n, i) => teams[i % count].push(n));
  document.getElementById('team-result').innerHTML = teams.map((t, i) => `<div class="card" style="margin-bottom:5px;"><b>${i+1}팀:</b> ${t.join(', ')}</div>`).join('');
}

// 운영진 로직
function checkAdmin() {
  if (document.getElementById('admin-pw').value === ADMIN_PW) {
    document.getElementById('admin-lock').style.display = 'none';
    document.getElementById('admin-content').style.display = 'block';
    renderAdmin();
  } else toast('틀렸습니다.');
}

async function renderAdmin() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  document.getElementById('admin-mlist').innerHTML = members.map(m => `<div class="mi"><span>${m.name}</span><button class="btn-sub" style="width:auto; padding:4px 10px;" onclick="toast('클로드 코드를 참고하여 수정 로직을 추가해보세요!')">수정</button></div>`).join('');
}

// 이벤트 핸들러
document.querySelectorAll('.nb').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+btn.dataset.page).classList.add('active');
  if(btn.dataset.page === 'sessions') renderSessionsTab();
  if(btn.dataset.page === 'members') renderMPage();
  if(btn.dataset.page === 'game') initGameTab();
});

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const t = btn.dataset.mtab;
  document.getElementById('mtab-list').style.display = t === 'list' ? 'block' : 'none';
  document.getElementById('mtab-stats').style.display = t === 'stats' ? 'block' : 'none';
});

document.querySelectorAll('.filter-chip').forEach(btn => btn.onclick = () => {
  btn.parentElement.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ciFilter = btn.dataset.filter;
  renderMPage();
});

document.getElementById('create-sess-btn').onclick = async () => {
  const name = document.getElementById('pub-sess-name').value;
  const date = document.getElementById('pub-sess-date').value;
  if(!name || !date) return toast('입력하세요.');
  await db.collection('sessions').add({ name, date, attendees: [], createdAt: Date.now() });
  _sessionsCache = null; renderSessionsTab(); toast('등록 완료!');
};

init();
</script>
</body>
