<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f8f9fa; --surface:#fff; --surface2:#efeff0; --border:rgba(0,0,0,.05);
  --text:#1a1a1b; --text2:#666; --text3:#999;
  --accent:#2d6a4f; --accent-l:#e8f5ee; --accent2:#e76f51; --my-highlight: #dfff00;
  --r:20px; --rs:12px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; appearance:none; -webkit-appearance:none;}
body{font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); line-height:1.5; min-height:100vh;}
header{background:#1a1a18; padding:1rem; text-align:center; position:sticky; top:0; z-index:200;}
.logo-text{font-family:'Arial Black',sans-serif; font-size:18px; font-weight:900; letter-spacing:1px; color:#F5A623}
.logo-text span{color:#E8162B}

/* 네비게이션 */
.nav{display:flex; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:100; padding:0 0.5rem;}
.nb{flex:1; padding:1rem 0; background:none; border:none; font-size:11px; font-weight:500; color:var(--text3); cursor:pointer; position:relative; transition:0.2s;}
.nb.active{color:var(--accent); font-weight:700;}
.nb.active::after{content:''; position:absolute; bottom:0; left:25%; width:50%; height:3px; background:var(--accent); border-radius:10px 10px 0 0;}

/* 페이지 레이아웃 */
.page{display:none; padding:1.25rem 1rem 5rem; max-width:480px; margin:0 auto;}
.page.active{display:block;}
.card{background:var(--surface); border-radius:var(--rs); padding:1.25rem; border:1px solid var(--border); margin-bottom:1rem; box-shadow:0 2px 8px rgba(0,0,0,0.02);}
.ct{font-size:11px; font-weight:700; color:var(--text3); letter-spacing:.08em; text-transform:uppercase; margin-bottom:.875rem}

/* 폼 스타일 */
input, select {
  width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: var(--rs);
  font-family: inherit; font-size: 14px; background: var(--surface2); color: var(--text);
  outline: none; margin-bottom: 0.65rem;
}

/* 탭 및 필터 */
.tab-container { display:flex; background:var(--surface2); border-radius:100px; padding:4px; margin-bottom:1.5rem; }
.tab-btn { flex:1; padding:8px 0; border:none; border-radius:100px; font-size:13px; font-weight:600; color:var(--text3); background:none; cursor:pointer; }
.tab-btn.active { background:var(--surface); color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,0.05); }

/* 리스트 항목 */
.mi{display:flex; align-items:center; gap:12px; padding:0.8rem 0; border-bottom:1px solid var(--border);}
.mi.is-me { background:var(--my-highlight); border-radius:12px; padding-left:10px; padding-right:10px; border:none; margin:4px 0; }
.av{width:40px; height:40px; border-radius:50%; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:18px;}
.mn{font-size:15px; font-weight:600;}
.mm{font-size:12px; color:var(--text3);}

/* 출석 바 */
.att-bar-bg{background:var(--surface2); border-radius:100px; height:8px; width:100%; overflow:hidden; margin-top:6px;}
.att-bar-fill{background:var(--accent); height:100%; border-radius:100px; transition:width 0.6s ease;}

/* 버튼 */
.btn-main { width:100%; padding:0.85rem; border:none; border-radius:var(--rs); font-size:14px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; margin-bottom:0.5rem;}
.btn-kakao { background:#FEE500; color:#191919; border:none; }

/* 게임 UI */
.game-result { text-align:center; padding:1rem 0; font-size:24px; font-weight:700; color:var(--accent); min-height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.check-list { max-height:180px; overflow-y:auto; background:var(--surface2); border-radius:12px; padding:10px; margin-bottom:10px; }
.check-item { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; border-bottom:1px solid rgba(0,0,0,0.03); }

.toast-el{position:fixed; bottom:5rem; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 24px; border-radius:100px; font-size:13px; opacity:0; transition:0.3s; z-index:999;}
.toast-el.show{opacity:1; bottom:6rem;}
</style>
</head>
<body>
<header><div class="logo-text">DO<span>R</span>DO</div></header>
<nav class="nav">
  <button class="nb active" data-page="members">👥 멤버</button>
  <button class="nb" data-page="sessions">📅 일정</button>
  <button class="nb" data-page="rules">📌 회칙</button>
  <button class="nb" data-page="game">🎮 게임</button>
  <button class="nb" data-page="admin">🔥 운영진</button>
</nav>

<div id="toast-el" class="toast-el"></div>

<div id="page-members" class="page active">
  <div class="tab-container">
    <button class="tab-btn active" data-mtab="list">멤버 목록</button>
    <button class="tab-btn" data-mtab="stats">출석 통계</button>
  </div>
  <div id="mtab-list"><div class="card"><div id="mlist"></div></div></div>
  <div id="mtab-stats" style="display:none">
    <div class="card"><div id="ci-att-list"></div></div>
  </div>
</div>

<div id="page-sessions" class="page">
  <div class="card">
    <div class="ct">🗓️ 새 일정 등록</div>
    <select id="pub-sess-cat"><option value="🏃 러닝">🏃 러닝</option><option value="🏔️ 등산">🏔️ 등산</option><option value="🍽️ 식사">🍽️ 식사</option><option value="🏋️ 운동">🏋️ 운동</option></select>
    <input type="text" id="pub-sess-name" placeholder="일정 제목"/>
    <input type="date" id="pub-sess-date"/>
    <div style="display:flex; gap:10px;"><input type="time" id="pub-sess-time" placeholder="시작"/><input type="time" id="pub-sess-endtime" placeholder="종료"/></div>
    <input type="text" id="pub-sess-place" placeholder="장소 (예: 미사호수공원)"/>
    <button class="btn-main" id="create-sess-btn">일정 등록하기</button>
  </div>
  <div id="sess-list"></div>
</div>

<div id="page-game" class="page">
  <div class="card">
    <div class="ct">🏆 이번달 출석왕</div>
    <div id="champion-result" class="game-result">데이터 분석 중...</div>
    <button id="kakao-share-champion" class="btn-main btn-kakao" style="display:none;">카톡으로 명예의 전당 공유</button>
  </div>

  <div class="card">
    <div class="ct">🎯 오늘의 운동 룰렛</div>
    <div id="roulette-result" class="game-result">무엇을 하게 될까요?</div>
    <button class="btn-main" onclick="spinRoulette()">🎰 룰렛 돌리기</button>
  </div>

  <div class="card">
    <div class="ct">🎲 팀 랜덤 배정</div>
    <div class="check-list" id="team-member-list"></div>
    <select id="team-count" style="margin-bottom:10px;"><option value="2">2팀으로 나누기</option><option value="3">3팀으로 나누기</option></select>
    <button class="btn-main" onclick="shuffleTeams()">팀 배정 시작</button>
    <div id="team-result"></div>
  </div>
</div>

<div id="page-rules" class="page"><div class="card"><div class="ct">회칙</div><div style="font-size:14px;">📌 [이름/동네] 형식 설정<br>📌 2주 이내 인증 필수</div></div></div>
<div id="page-admin" class="page"><div class="card" style="text-align:center;">🔒 비밀번호: dordo2023</div></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw",
  authDomain: "dordo-17766.firebaseapp.com",
  projectId: "dordo-17766",
  storageBucket: "dordo-17766.firebasestorage.app",
  messagingSenderId: "616591115480",
  appId: "1:616591115480:web:ade08d721401f9f6ec03ad"
});
const db = firebase.firestore();
try { Kakao.init('a961440bf90100c6847da5ee2fde06e1'); } catch(e) {}

const USER_NAME_KEY = 'dordo-user-name';
const MATE_ORDER = ['호정/리더', '황윤정/소통메이트', '주동준/운동메이트'];

async function getMembers() { const s = await db.collection('members').get(); return s.docs.map(d => ({id: d.id, ...d.data()})); }
async function getAllSessions() { const s = await db.collection('sessions').orderBy('date','desc').get(); return s.docs.map(d => ({id: d.id, ...d.data()})); }

function sortMembers(members) {
  return [...members].sort((a, b) => {
    const ai = MATE_ORDER.indexOf(a.name), bi = MATE_ORDER.indexOf(b.name);
    if (ai !== bi) return (ai === -1 ? 1 : bi === -1 ? -1 : ai - bi);
    return (a.joined || '999999').localeCompare(b.joined || '999999');
  });
}

// 멤버 & 통계 렌더링
async function renderMPage() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  const sorted = sortMembers(members);
  const myName = localStorage.getItem(USER_NAME_KEY);
  
  document.getElementById('mlist').innerHTML = sorted.map(m => `<div class="mi ${m.name===myName?'is-me':''}"><div class="av">${m.role==='mate'?'🔥':'🐣'}</div><div style="flex:1"><div class="mn">${m.name}</div><div class="mm">${m.count||0}회 참석</div></div></div>`).join('');

  const today = new Date().toISOString().split('T')[0];
  const fs = sessions.filter(s => s.date <= today);
  const counts = {}; fs.forEach(s => (s.attendees||[]).forEach(a => counts[a.memberId] = (counts[a.memberId]||0)+1));

  document.getElementById('ci-att-list').innerHTML = sorted.map(m => {
    const pct = fs.length ? Math.round((counts[m.id]||0)/fs.length*100) : 0;
    return `<div class="mi ${m.name===myName?'is-me':''}"><div style="flex:1"><div class="mn">${m.name}</div><div class="att-bar-bg"><div class="att-bar-fill" style="width:${pct}%;"></div></div></div><div style="font-weight:700; color:var(--accent); margin-left:10px;">${pct}%</div></div>`;
  }).join('');
}

// 일정 렌더링
async function renderSessionsTab() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  const today = new Date().toISOString().split('T')[0], myName = localStorage.getItem(USER_NAME_KEY);
  
  document.getElementById('sess-list').innerHTML = sessions.map(s => {
    const isPast = s.date < today, atts = s.attendees || [], me = members.find(m => m.name === myName);
    const isAtt = me && atts.some(a => a.memberId === me.id);
    return `<div class="card"><div style="display:flex; justify-content:space-between;"><b>${s.name}</b><span style="font-size:11px; color:var(--text3);">${isPast?'종료':'예정'}</span></div><div style="font-size:12px; color:var(--text3); margin-bottom:8px;">${s.cat} | ${s.date} ${s.time||''} | 📍 ${s.place||'미정'}</div><div class="att-list-wrap">${atts.map(a => `<span class="att-chip">${members.find(m=>m.id===a.memberId)?.name.split('/')[0]}</span>`).join('')}</div>${!isPast && me ? `<button class="btn-main ${isAtt?'btn-sub':''}" onclick="toggleAttend('${s.id}', ${isAtt})">${isAtt?'참석 취소':'참석하기'}</button>`:''}</div>`;
  }).join('');
}

async function toggleAttend(sid, isAtt) {
  const name = localStorage.getItem(USER_NAME_KEY), members = await getMembers(), me = members.find(x => x.name === name);
  const ref = db.collection('sessions').doc(sid), s = (await ref.get()).data();
  let next = s.attendees || [];
  if (isAtt) next = next.filter(x => x.memberId !== me.id); else next.push({memberId: me.id});
  await ref.update({ attendees: next }); await db.collection('members').doc(me.id).update({count: isAtt ? (me.count-1) : (me.count+1)});
  renderSessionsTab();
}

// 게임 로직 (완벽 복구)
async function initGameTab() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  const thisMonth = new Date().toISOString().slice(0,7);
  const fs = sessions.filter(s => s.date.startsWith(thisMonth));
  const counts = {}; fs.forEach(s => (s.attendees||[]).forEach(a => counts[a.memberId] = (counts[a.memberId]||0)+1));
  const ranked = members.map(m => ({...m, mc: counts[m.id]||0})).sort((a,b) => b.mc - a.mc);
  
  if (ranked[0]?.mc > 0) {
    document.getElementById('champion-result').innerHTML = `👑 ${ranked[0].name}<br><span style="font-size:14px; font-weight:400;">이번 달 ${ranked[0].mc}회 참석!</span>`;
    document.getElementById('kakao-share-champion').style.display = 'block';
  }
  document.getElementById('team-member-list').innerHTML = members.map(m => `<label class="check-item"><input type="checkbox" class="team-cb" data-name="${m.name}"> ${m.name}</label>`).join('');
}

function spinRoulette() {
  const options = ['3km 러닝', '5km 러닝', '스쿼트 100개', '플랭크 3분', '휴식!', '계단 오르기'];
  const res = document.getElementById('roulette-result');
  let count = 0; const inv = setInterval(() => {
    res.textContent = options[Math.floor(Math.random()*options.length)];
    if (++count > 20) clearInterval(inv);
  }, 80);
}

function shuffleTeams() {
  const selected = [...document.querySelectorAll('.team-cb:checked')].map(cb => cb.dataset.name);
  if (selected.length < 2) return alert('2명 이상 선택하세요');
  const count = document.getElementById('team-count').value;
  const shuffled = selected.sort(() => Math.random() - 0.5);
  const teams = Array.from({length: count}, () => []);
  shuffled.forEach((n, i) => teams[i % count].push(n));
  document.getElementById('team-result').innerHTML = teams.map((t, i) => `<div style="font-size:14px; margin-top:5px;"><b>${i+1}팀:</b> ${t.join(', ')}</div>`).join('');
}

// 공용 탭 전환
document.querySelectorAll('.nb').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active'); document.getElementById('page-'+btn.dataset.page).classList.add('active');
  if(btn.dataset.page === 'game') initGameTab();
  if(btn.dataset.page === 'sessions') renderSessionsTab();
  if(btn.dataset.page === 'members') renderMPage();
});

document.querySelectorAll('.tab-btn').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('mtab-list').style.display = btn.dataset.mtab === 'list' ? 'block' : 'none';
  document.getElementById('mtab-stats').style.display = btn.dataset.mtab === 'stats' ? 'block' : 'none';
});

document.getElementById('create-sess-btn').onclick = async () => {
  const name = document.getElementById('pub-sess-name').value, date = document.getElementById('pub-sess-date').value;
  if(!name || !date) return;
  await db.collection('sessions').add({ name, date, cat: document.getElementById('pub-sess-cat').value, time: document.getElementById('pub-sess-time').value, endtime: document.getElementById('pub-sess-endtime').value, place: document.getElementById('pub-sess-place').value, attendees: [] });
  renderSessionsTab();
};

renderMPage();
</script>
</body>
</html>
