<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,.08);
  --text:#1a1a18;--text2:#6b6b65;--text3:#a0a09a;

  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#1a1a18;padding:.55rem 1rem;display:flex;align-items:center;justify-content:center}

.logo-text span{color:#E8162B}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 .5rem;position:sticky;top:0;z-index:100}
.nb{flex:1;padding:.85rem .3rem;background:none;border:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.nb.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:1.25rem 1rem 5rem;max-width:480px;margin:0 auto}
.page.active{display:block}
.welcome-container { padding: 1.25rem 1rem 0; max-width: 480px; margin: 0 auto; }
.welcome-box { background: var(--surface); border-radius: var(--rs); padding: 1rem; border: 1px solid var(--border); display: none; align-items: center; justify-content: space-between; }
.welcome-text { font-size: 14px; font-weight: 700; color: var(--accent); }
.welcome-reset { font-size: 11px; color: var(--text3); cursor: pointer; text-decoration: underline; }
.my-check-box { background: var(--accent-l); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; text-align: center; border: 1px solid var(--accent); }
.my-check-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 0.75rem; }
.my-check-btns { display: flex; gap: 8px; }
.btn-rsvp { flex: 1; padding: 0.75rem; border-radius: 8px; border: none; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn-rsvp.join { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
.btn-rsvp.absent { background: #fff; color: #991b1b; border: 1px solid #fee2e2; }
.btn-rsvp.active-join { background: var(--accent) !important; color: #fff !important; }
.btn-rsvp.active-absent { background: #991b1b !important; color: #fff !important; }
.status-label { font-size: 11px; font-weight: 700; display: block; margin-bottom: 6px; }
.status-label.join { color: var(--accent); }
.status-label.absent { color: #991b1b; margin-top: 10px; }
.chip-container { display: flex; flex-wrap: wrap; gap: 4px; }
.status-chip { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: var(--surface2); color: var(--text2); display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); }
.status-chip.is-me { background: var(--my-highlight); color: #000; font-weight: 700; border: 1px solid #bfff00; }
.mi.is-me { background: var(--my-highlight) !important; border: 1.5px solid #bfff00 !important; border-radius: 12px; margin: 4px 0; padding: 8px; }
.mi.is-me .mn { font-weight: 900; color: #000; }
.card{background:var(--surface);border-radius:var(--r);padding:1.25rem;border:1px solid var(--border);margin-bottom:1rem}
.ct{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.875rem}
input,select{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:15px;color:var(--text);background:var(--surface2);outline:none;margin-bottom:.65rem;box-sizing:border-box}
.btn{width:100%;padding:.85rem;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.bp{background:var(--accent);color:#fff}
.bs{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.mi{display:flex;align-items:center;gap:10px;padding:.65rem 0;border-bottom:1px solid var(--border)}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm{font-size:12px;color:var(--text3);margin-top:1px}
.gp{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;background:var(--surface2);color:var(--text3);white-space:nowrap}
.gp.mate{background:#fff3e0;color:#e65100}
.toast-el{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(300px);background:#1a1a18;color:#fff;padding:.7rem 1.4rem;border-radius:100px;font-size:14px;z-index:999;transition:all .3s;opacity:0}
.toast-el.show{transform:translateX(-50%) translateY(0);opacity:1}
.filter-tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.ftab, .mtab, .cat-tab{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer;color:var(--text3);font-weight:500}
.ftab.active, .mtab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-tab.active{background:#e76f51;color:#fff;border-color:#e76f51}
.att-bar-bg{background:var(--surface2);border-radius:4px;height:4px;width:100%;overflow:hidden;margin-top:4px}
.att-bar-fill{background:var(--accent);height:4px;border-radius:4px}
.sess-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);margin-bottom:.75rem;overflow:hidden}
.sess-card-hd{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;cursor:pointer}
.sess-card-bd{padding:0 1.25rem 1rem;display:none}
.sess-card-bd.open{display:block}
.mb-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.mb-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:1.5rem;width:100%;max-width:480px;max-height:80vh;overflow-y:auto}
.mt2{font-size:16px;font-weight:700;margin-bottom:1rem}
.loading{text-align:center;padding:2rem;color:var(--text3);font-size:14px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
firebase.initializeApp({ apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw", authDomain: "dordo-17766.firebaseapp.com", projectId: "dordo-17766", storageBucket: "dordo-17766.firebasestorage.app", messagingSenderId: "616591115480", appId: "1:616591115480:web:ade08d721401f9f6ec03ad" });
const db = firebase.firestore();
const USER_NAME_KEY = 'dordo-user-name';
const ADMIN_PW = "dordo2023";
const MATE_ORDER = ['호정/리더','황윤정/소통메이트','주동준/운동메이트'];
const JOIN_DATES = { '김병희/덕풍':'230410','성준/미사':'230715','장지연/미사':'230916','왕신민/미사':'231013','김규성/광주':'230730','헤라/광주🐺':'230730','최형규/미사':'240501','주성/미사':'240620','박현정/망월':'250301','김민호/경기광주':'250507','정다운/미사':'250511','양윤석/덕풍':'250512','민연희/미사':'250525','우빛나/미사':'250530','이삭/양평':'250619','은지/미사':'250623','박성민/덕풍':'250804','가은/미사':'250817','도영/덕풍':'250904','큐성/덕풍':'260128','최예인/미사':'260411','이정민/미사':'260422','대훈/덕풍':'260430','원재윤':'260422' };

let isAdmin = false; let ciFilter = 'all'; let catFilter = 'all'; let attSortByCount = false;
let _membersCache = null; let _sessionsCache = null; let _confirmResolve = null; let _promptResolve = null;

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toast(msg) { const t = document.getElementById('toast-el'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
function showConfirm(msg) { return new Promise(resolve => { _confirmResolve = resolve; document.getElementById('confirm-msg').textContent = msg; document.getElementById('confirm-modal').classList.add('open'); }); }
document.getElementById('confirm-ok').onclick = () => { closeModal('confirm-modal'); if(_confirmResolve) _confirmResolve(true); };
document.getElementById('confirm-cancel').onclick = () => { closeModal('confirm-modal'); if(_confirmResolve) _confirmResolve(false); };

function grade(m) { if (m.name?.startsWith('헤라')) return {e:'🐺', n:'허스키'}; if (m.role === 'mate') return {e:'🔥', n:'메이트'}; if (m.count >= 15) return {e:'Swan', n:'베테랑'}; if (m.count >= 5) return {e:'🐥', n:'활동'}; return {e:'🐣', n:'새내기'}; }
function sortMembers(members) {
  const myName = localStorage.getItem(USER_NAME_KEY);
  return [...members].sort((a, b) => {
    if (a.name === myName) return -1; if (b.name === myName) return 1;
    const ai = MATE_ORDER.indexOf(a.name); const bi = MATE_ORDER.indexOf(b.name);
    if (ai !== -1 && bi !== -1) return ai - bi; if (ai !== -1) return -1; if (bi !== -1) return 1;
    return (a.joined || JOIN_DATES[a.name] || '999999').localeCompare(b.joined || JOIN_DATES[b.name] || '999999');
  });
}
function clearCache() { _membersCache = null; _sessionsCache = null; }
async function getMembers(f) { if (_membersCache && !f) return _membersCache; const s = await db.collection('members').get(); _membersCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _membersCache; }
async function getAllSessions(f) { if (_sessionsCache && !f) return _sessionsCache; const s = await db.collection('sessions').orderBy('date','desc').get(); _sessionsCache = s.docs.map(d => ({id: d.id, ...d.data()})); return _sessionsCache; }

async function initUser() {
  const name = localStorage.getItem(USER_NAME_KEY);
  if (name) {
    document.getElementById('welcome-box').style.display = 'flex';
    document.getElementById('welcome-text').textContent = `${name.split('/')[0]}님 환영해요! 🔥`;
  } else {
    setTimeout(async () => {
      const m = await getMembers();
      document.getElementById('user-select-list').innerHTML = sortMembers(m).map(x => `<div class="mi" style="cursor:pointer; padding:1rem" onclick="setUser('${x.name}')">${grade(x).e} ${x.name}</div>`).join('');
      document.getElementById('user-setting-modal').classList.add('open');
    }, 1500);
  }
}
function setUser(n) { localStorage.setItem(USER_NAME_KEY, n); closeModal('user-setting-modal'); initUser(); renderMPage(); toast(`${n.split('/')[0]}님 반가워요!`); }
function resetUser() { localStorage.removeItem(USER_NAME_KEY); location.reload(); }

function showPage(n, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + n).classList.add('active'); if (btn) btn.classList.add('active');
  if (n === 'members') renderMPage(); if (n === 'sessions') renderSessionsTab(); if (n === 'game') initGameTab();
}

async function renderMPage() {
  const [m, s] = await Promise.all([getMembers(), getAllSessions()]); const myName = localStorage.getItem(USER_NAME_KEY);
  document.getElementById('mlist').innerHTML = sortMembers(m).map(x => `<div class="mi ${x.name===myName?'is-me':''}" onclick="openMemberDetail('${x.id}')"><div class="av">${grade(x).e}</div><div style="flex:1"><div class="mn">${x.name}${x.name===myName?' (나)':''}</div><div class="mm">${x.count}회 참석</div></div><span class="gp ${x.role==='mate'?'mate':''}">${x.role==='mate'?'운영진':''}</span></div>`).join('');
  renderAttBoard();
}

async function renderAttBoard() {
  const [members, sessions] = await Promise.all([getMembers(), getAllSessions()]);
  const today = new Date().toLocaleDateString('en-CA'); const myName = localStorage.getItem(USER_NAME_KEY);
  let fs = sessions.filter(s => s.date <= today);
  if (ciFilter === 'month') fs = fs.filter(s => s.date.startsWith(today.slice(0,7)));
  if (ciFilter === 'year') fs = fs.filter(s => s.date.startsWith(today.slice(0,4)));
  if (catFilter !== 'all') fs = fs.filter(s => s.cat === catFilter);
  const total = fs.length; document.getElementById('ci-total-sess').textContent = total;
  const counts = {}; fs.forEach(s => (s.attendees||[]).forEach(a => counts[a.memberId] = (counts[a.memberId]||0) + 1));
  document.getElementById('ci-att-list').innerHTML = sortMembers(members).map(m => {
    const cnt = counts[m.id]||0; const pct = total ? Math.round(cnt/total*100) : 0; const isMe = m.name === myName;
    return `<div class="mi ${isMe?'is-me':''}" onclick="openMemberDetail('${m.id}')"><div class="av">${grade(m).e}</div><div style="flex:1"><div class="mn">${m.name}</div><div class="att-bar-bg"><div class="att-bar-fill" style="width:${pct}%; background:${isMe?'#000':'var(--accent)'}"></div></div></div><span class="gp" style="${isMe?'background:#000;color:#fff':''}">${pct}%</span></div>`;
  }).join('');
}
  // 일정 탭 및 RSVP 처리
async function renderSessionsTab() {
  const [sessions, members] = await Promise.all([getAllSessions(), getMembers()]);
  const today = new Date().toLocaleDateString('en-CA');
  const months = [...new Set(sessions.map(s => s.date.slice(0,7)))].sort().reverse();
  document.getElementById('sess-month-filter').innerHTML = months.map(m => `<div class="sess-card"><div class="sess-card-hd" onclick="this.nextElementSibling.classList.toggle('open')"><span>${m.replace('-','년 ')}월</span><span>▼</span></div><div class="sess-card-bd open">${renderCards(sessions.filter(s=>s.date.startsWith(m)), members, today)}</div></div>`).join('');
}

function renderCards(sessions, members, today) {
  const myName = localStorage.getItem(USER_NAME_KEY); const me = members.find(m => m.name === myName);
  return sessions.map(s => {
    const isPast = s.date < today; const atts = s.attendees || []; const abss = s.absentees || [];
    const attChips = atts.map(a => { const m = members.find(x => x.id === a.memberId); return m ? `<span class="status-chip ${m.name===myName?'is-me':''}" onclick="openMemberDetail('${m.id}')">${grade(m).e} ${m.name.split('/')[0]}</span>` : ''; }).join('');
    const absChips = abss.map(mid => { const m = members.find(x => x.id === mid); return m ? `<span class="status-chip ${m.name===myName?'is-me':''}" onclick="openMemberDetail('${mid}')">${grade(m).e} ${m.name.split('/')[0]}</span>` : ''; }).join('');
    const isMeAtt = atts.some(a => a.memberId === me?.id); const isMeAbs = abss.includes(me?.id);
    return `<div class="card" style="padding:1.25rem"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><div><div style="font-weight:700;font-size:16px">${s.name}</div><div style="font-size:12px;color:var(--text3)">${s.date} · ${atts.length}명 참석</div></div><span style="font-size:11px;padding:3px 10px;border-radius:10px;background:${isPast?'#eee':'var(--accent-l)'};color:${isPast?'#666':'var(--accent)'}">${isPast?'종료':'예정'}</span></div>${(!isPast && me) ? `<div class="my-check-box"><div class="my-check-title">${me.name.split('/')[0]}님, 참석하시나요? 🔥</div><div class="my-check-btns"><button class="btn-rsvp join ${isMeAtt?'active-join':''}" onclick="doAttend('${s.id}','${me.id}',${isMeAtt})">${isMeAtt?'참석 완료 ✓':'참석할게요'}</button><button class="btn-rsvp absent ${isMeAbs?'active-absent':''}" onclick="doAbsent('${s.id}','${me.id}',${isMeAbs})">${isMeAbs?'불참 완료 ✗':'이번엔 불참'}</button></div></div>` : ''}<div style="text-align:left; border-top: 1px solid var(--border); padding-top: 12px;">${attChips ? `<span class="status-label join">참석 (${atts.length})</span><div class="chip-container">${attChips}</div>` : ''}${absChips ? `<span class="status-label absent">불참 (${abss.length})</span><div class="chip-container">${absChips}</div>` : ''}${(!attChips && !absChips) ? '<div style="font-size:12px;color:var(--text3);text-align:center">아직 응답자가 없어요</div>' : ''}</div></div>`;
  }).join('');
}

window.doAttend = async (sid, mid, a) => {
  const ref = db.collection('sessions').doc(sid); const snap = await ref.get(); const s = snap.data();
  if(a) { await ref.update({ attendees: s.attendees.filter(x => x.memberId !== mid) }); const m = await db.collection('members').doc(mid).get(); if(m.exists && (m.data().count||0)>0) await db.collection('members').doc(mid).update({count: m.data().count-1}); }
  else { const t = new Date().getHours().toString().padStart(2,'0')+':'+new Date().getMinutes().toString().padStart(2,'0'); await ref.update({ attendees: [...(s.attendees||[]), {memberId:mid, time:t}], absentees: (s.absentees||[]).filter(id => id !== mid) }); const m = await db.collection('members').doc(mid).get(); if(m.exists) await db.collection('members').doc(mid).update({count: (m.data().count||0)+1}); }
  clearCache(); renderSessionsTab(); toast('참석 여부가 업데이트됐어요!');
};

window.doAbsent = async (sid, mid, a) => {
  const ref = db.collection('sessions').doc(sid); const snap = await ref.get(); const s = snap.data();
  if(a) { await ref.update({ absentees: s.absentees.filter(id => id !== mid) }); }
  else { const ok = await showConfirm('불참 처리할까요?'); if(!ok) return; const wasAtt = s.attendees.some(x => x.memberId === mid); await ref.update({ attendees: s.attendees.filter(x => x.memberId !== mid), absentees: [...new Set([...(s.absentees||[]), mid])] }); if(wasAtt) { const m = await db.collection('members').doc(mid).get(); if(m.exists && (m.data().count||0)>0) await db.collection('members').doc(mid).update({count: m.data().count-1}); } }
  clearCache(); renderSessionsTab(); toast('불참 처리 완료');
};

async function initGameTab() {
  const [m, s] = await Promise.all([getMembers(), getAllSessions()]);
  const rSnap = await db.collection('meta').doc('roulette').get(); const rItems = rSnap.exists ? rSnap.data().items : ['러닝 3km','홈트 20분','등산','걷기 30분'];
  document.getElementById('roulette-options').innerHTML = rItems.map(it => `<label style="display:inline-block; margin-right:8px; font-size:13px"><input type="checkbox" checked data-val="${it}"/> ${it}</label>`).join('');
  document.getElementById('team-member-list').innerHTML = sortMembers(m).map(x => `<label style="display:block; padding:4px 0; font-size:14px"><input type="checkbox" checked data-name="${x.name}"/> ${grade(x).e} ${x.name}</label>`).join('');
}
document.getElementById('roulette-btn').onclick = () => {
  const all = [...document.querySelectorAll('#roulette-options input:checked')].map(i => i.dataset.val); if(!all.length) return toast('선택해주세요');
  const res = document.getElementById('roulette-result'); let c = 0; const iv = setInterval(() => { res.textContent = all[Math.floor(Math.random()*all.length)]; if(++c > 20) clearInterval(iv); }, 80);
};
document.getElementById('team-shuffle-btn').onclick = () => {
  const sel = [...document.querySelectorAll('#team-member-list input:checked')].map(i => i.dataset.name); const count = parseInt(document.getElementById('team-count').value);
  if(sel.length < count) return toast('멤버 부족'); const shuf = sel.sort(() => Math.random()-0.5); const teams = Array.from({length:count},()=>[]); shuf.forEach((x,i)=>teams[i%count].push(x));
  document.getElementById('team-result').innerHTML = teams.map((t,i)=>`<div style="background:var(--surface2);padding:8px;border-radius:8px;margin-top:4px"><strong>${i+1}팀:</strong> ${t.join(', ')}</div>`).join('');
};

document.getElementById('admin-login-btn').onclick = () => { if(document.getElementById('admin-pw').value === ADMIN_PW) { isAdmin=true; document.getElementById('admin-lock').style.display='none'; document.getElementById('admin-content').style.display='block'; renderAdminContent(); } else toast('틀렸어요'); };
async function renderAdminContent() {
  const [m, s] = await Promise.all([getMembers(true), getAllSessions(true)]);
  document.getElementById('admin-sess-list').innerHTML = s.slice(0,10).map(x => `<div class="mi"><span>${x.name} (${x.date})</span></div>`).join('');
  document.getElementById('admin-mlist').innerHTML = sortMembers(m).map(x => `<div class="mi"><span>${x.name}</span><button class="bs" onclick="openEdit('${x.id}')">수정</button></div>`).join('');
}

async function openMemberDetail(id) {
  const [mems, sess] = await Promise.all([getMembers(), getAllSessions()]); const m = mems.find(x => x.id === id); if(!m) return;
  const today = new Date().toLocaleDateString('en-CA'); const attended = sess.filter(s => s.date <= today && (s.attendees||[]).some(a => a.memberId === id));
  document.getElementById('md-header').innerHTML = `<div class="av">${grade(m).e}</div><div><div style="font-weight:700">${m.name}</div><div style="font-size:12px;color:var(--text3)">총 ${attended.length}회 참석</div></div>`;
  document.getElementById('md-sessions').innerHTML = attended.map(s => `<div class="mi"><div>${s.name}</div><div style="font-size:11px;color:var(--text3)">${s.date}</div></div>`).join('') || '기록 없음';
  document.getElementById('member-detail-modal').classList.add('open');
}
