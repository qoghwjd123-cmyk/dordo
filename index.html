<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,.08);
  --text:#1a1a18;--text2:#6b6b65;--text3:#a0a09a;
  --accent:#2d6a4f;--accent-l:#e8f5ee;--accent2:#e76f51;--accent2-l:#fdf0ec;
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#1a1a18;padding:.55rem 1rem;display:flex;align-items:center;justify-content:center}
.logo-text{font-family:'Arial Black','Arial',sans-serif;font-size:20px;font-weight:900;letter-spacing:2px;color:#F5A623}
.logo-text span{color:#E8162B}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 .5rem;position:sticky;top:0;z-index:100}
.nb{flex:1;padding:.85rem .3rem;background:none;border:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.nb.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:1.25rem 1rem 5rem;max-width:480px;margin:0 auto}
.page.active{display:block}
.card{background:var(--surface);border-radius:var(--r);padding:1.25rem;border:1px solid var(--border);margin-bottom:1rem}
.ct{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.875rem}
input[type=date]{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:15px;color:var(--text);background:var(--surface2);outline:none;transition:border-color .2s;margin-bottom:.65rem;appearance:none;-webkit-appearance:none}
input,select{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:15px;color:var(--text);background:var(--surface2);outline:none;transition:border-color .2s;margin-bottom:.65rem}
input:focus,select:focus{border-color:var(--accent);background:#fff}
.btn{width:100%;padding:.85rem;border:none;border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;margin-bottom:.4rem}
.btn:active{transform:scale(.98)}
.bp{background:var(--accent);color:#fff}
.bs{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.mi{display:flex;align-items:center;gap:10px;padding:.65rem 0;border-bottom:1px solid var(--border)}
.mi:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm{font-size:12px;color:var(--text3);margin-top:1px}
.gp{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;background:var(--surface2);color:var(--text3);white-space:nowrap;flex-shrink:0}
.gp.mate{background:#fff3e0;color:#e65100}
.gp.green{background:var(--accent-l);color:var(--accent)}
.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
