<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DORDO</title>
<meta property="og:title" content="DORDO 두알두"/>
<meta property="og:description" content="두알두 러닝 모임 — 일정 참석 및 출석 현황"/>
<meta property="og:image" content="https://qoghwjd123-cmyk.github.io/logo.png"/>
<meta property="og:url" content="https://qoghwjd123-cmyk.github.io/dordo"/>
<meta property="og:type" content="website"/>
<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,.08);
  --text:#1a1a18;--text2:#6b6b65;--text3:#a0a09a;
  --accent:#2d6a4f;--accent-l:#e8f5ee;--accent2:#e76f51;--accent2-l:#fdf0ec;
  --kakao:#FEE500;--kakao-text:#191919;
  --my-highlight: #dfff00; 
  --r:16px;--rs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:#1a1a18;padding:.55rem 1rem;display:flex;align-items:center;justify-content:center}
.logo-text{font-family:'Arial Black','Arial',sans-serif;font-size:20px;font-weight:900;letter-spacing:2px;color:#F5A623}
.logo-text span{color:#E8162B}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 .5rem;position:sticky;top:0;z-index:100}
.nb{flex:1;padding:.85rem .3rem;background:none;border:none;font-family:inherit;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.nb.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:1.25rem 1rem 5rem;max-width:480px;margin:0 auto}
.page.active{display:block}

/* 카테고리 배지 & 상태 태그 */
.cat-badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;margin-right:4px}
.cat-badge.run{background:#e8f5ee;color:#1a6b3c}
.cat-badge.hike{background:#e8f0fb;color:#1a4a9e}
.cat-badge.eat{background:#fdf0ec;color:#b84c1a}
.cat-badge.workout{background:#f3e8fb;color:#6b21a8}
.cat-badge.etc{background:#f0efe9;color:#6b6b65}

.status-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700;float:right}
.status-tag.upcoming{background:#e8f5ee;color:#2d6a4f}
.status-tag.past{background:#f0efe9;color:var(--text3)}

/* 체크박스 & 명단 칩 */
.my-check-box { background: var(--accent-l); border-radius: 12px; padding: 1.25rem; margin-top: 1rem; text-align: center; border: 1px solid var(--accent); }
.my-check-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 0.75rem; }
.my-check-btns { display: flex; gap: 8px; }
.btn-rsvp { flex: 1; padding: 0.75rem; border-radius: 8px; border: none; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.btn-rsvp.join { background: var(--accent); color: #fff; }
.btn-rsvp.absent { background: #fee2e2; color: #991b1b; }
.btn-rsvp.active-join { background: var(--accent); color: #fff; box-shadow: 0 0 0 3px var(--accent-l); }

.att-list-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.att-chip { padding: 4px 10px; background: var(--surface2); border-radius: 20px; font-size: 12px; color: var(--text2); font-weight: 500; border: 1px solid var(--border); display:flex; align-items:center; gap:4px;}
.att-chip.is-me { background: var(--my-highlight); color: #000; border-color: #bfff00; font-weight: 700; }

.btn-kakao { background: var(--kakao); color: var(--kakao-text); border:none; border-radius:8px; padding:0.85rem; width:100%; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:6px; }

.card{background:var(--surface);border-radius:var(--r);padding:1.25rem;border:1px solid var(--border);margin-bottom:1rem; position:relative;}
.ct{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.875rem}
input,select{width:100%;padding:.7rem 1rem;border:1px solid var(--border);border-radius:var(--rs);font-family:inherit;font-size:15px;color:var(--text);background:var(--surface2);outline:none;margin-bottom:.65rem;box-sizing:border-box}
.btn{width:100%;padding:.85rem;border:none;border-radius:var(--rs);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;}
.bp{background:var(--accent);color:#fff}
.mi{display:flex;align-items:center;gap:10px;padding:.65rem 0;border-bottom:1px solid var(--border)}
.toast-el{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(300px);background:#1a1a18;color:#fff;padding:.7rem 1.4rem;border-radius:100px;font-size:14px;font-weight:500;transition:transform .3s, opacity .3s;z-index:999;white-space:nowrap;opacity:0}
.toast-el.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header><div class="logo-text">DO<span>R</span>DO</div></header>
<nav class="nav">
  <button class="nb" data-page="members">👥 멤버</button>
  <button class="nb active" data-page="sessions">📅 일정</button>
  <button class="nb" data-page="game">🎮 게임</button>
</nav>

<div id="toast-el" class="toast-el"></div>

<div id="page-sessions" class="page active">
  <div class="card">
    <div class="ct">새 일정 등록</div>
    <input type="text" id="pub-sess-name" placeholder="일정 이름"/>
    <input type="date" id="pub-sess-date"/>
    <select id="pub-sess-cat">
      <option value="run">🏃 런닝</option>
      <option value="hike">🏔️ 등산</option>
      <option value="eat">🍽️ 식사</option>
      <option value="workout">🏋️ 운동</option>
      <option value="etc">기타</option>
    </select>
    <button class="btn bp" id="create-sess-btn">일정 등록</button>
  </div>
  <div id="sess-list"></div>
</div>

<div id="page-members" class="page">
  <div class="card"><div class="ct">준비중</div></div>
</div>

<script>
// 카카오 SDK 초기화
try { 
  Kakao.init('a961440bf90100c6847da5ee2fde06e1'); 
} catch(e) { console.error('Kakao SDK Init Error:', e); }

firebase.initializeApp({
  apiKey: "AIzaSyDKLj4tBOmGPmX1keWwkn0m8LlqDixzMEw",
  authDomain: "dordo-17766.firebaseapp.com",
  projectId: "dordo-17766",
  storageBucket: "dordo-17766.firebasestorage.app",
  messagingSenderId: "616591115480",
  appId: "1:616591115480:web:ade08d721401f9f6ec03ad"
});
const db = firebase.firestore();
const USER_NAME_KEY = 'dordo-user-name';
let _membersCache = null;

function grade(m) { if (m.role === 'mate') return '🔥'; if (m.count >= 15) return '🦢'; if (m.count >= 5) return '🐥'; return '🐣'; }
function toast(msg) { const t = document.getElementById('toast-el'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

async function getMembers() { 
  if (_membersCache) return _membersCache; 
  const s = await db.collection('members').get(); 
  _membersCache = s.docs.map(d => ({id: d.id, ...d.data()})); 
  return _membersCache; 
}

async function renderSessionsTab() {
  const members = await getMembers();
  const sSnap = await db.collection('sessions').orderBy('date','desc').get();
  const sessions = sSnap.docs.map(d => ({id: d.id, ...d.data()}));
  const today = new Date().toISOString().split('T')[0];
  const myName = localStorage.getItem(USER_NAME_KEY);
  
  const catMap = { run:'🏃 런닝', hike:'🏔️ 등산', eat:'🍽️ 식사', workout:'🏋️ 운동', etc:'기타' };
  
  document.getElementById('sess-list').innerHTML = sessions.map(s => {
    const isPast = s.date < today;
    const attendees = s.attendees || [];
    
    const getNameChips = () => {
      if (attendees.length === 0) return `<div class="empty" style="padding:0.5rem; font-size:12px; color:var(--text3)">참석자를 기다리고 있어요!</div>`;
      return attendees.map(a => {
        const m = members.find(mem => mem.id === a.memberId);
        if (!m) return '';
        return `<span class="att-chip ${m.name === myName ? 'is-me' : ''}">${grade(m)} ${m.name.split('/')[0]}</span>`;
      }).join('');
    };

    const me = members.find(m => m.name === myName);
    const isAtt = me ? attendees.some(a => a.memberId === me.id) : false;

    return `
      <div class="card">
        <span class="status-tag ${isPast?'past':'upcoming'}">${isPast?'종료':'예정'}</span>
        <div style="font-weight:700; font-size:16px; margin-bottom:4px">${s.name}</div>
        <div style="font-size:12px; color:var(--text3); margin-bottom:12px">
          <span class="cat-badge ${s.category || 'etc'}">${catMap[s.category] || '기타'}</span>
          ${s.date}
        </div>
        
        <div class="ct" style="margin-bottom:8px">참석 현황 (${attendees.length}명)</div>
        <div class="att-list-wrap">${getNameChips()}</div>

        ${!isPast && me ? `
          <div class="my-check-box">
            <div class="my-check-title">${me.name.split('/')[0]}님, 참석하시나요?</div>
            <div class="my-check-btns">
              <button class="btn-rsvp join ${isAtt?'active-join':''}" onclick="doAttend('${s.id}','${me.id}',${isAtt})">${isAtt?'✓ 완료':'참석하기'}</button>
            </div>
          </div>
        ` : ''}

        ${!isPast ? `<button class="btn-kakao" onclick="shareKakao('${s.name}', '${s.date}')">💬 카카오톡 공유</button>` : ''}
      </div>`;
  }).join('');
}

function shareKakao(name, date) {
  if (!window.Kakao || !Kakao.isInitialized()) return toast('카카오 인증 오류');
  Kakao.Share.sendDefault({
    objectType: 'feed',
    content: {
      title: `[DORDO] ${name}`,
      description: `${date} 모임에 함께해요!`,
      imageUrl: 'https://qoghwjd123-cmyk.github.io/logo.png',
      link: { mobileWebUrl: location.href, webUrl: location.href }
    },
    buttons: [{ title: '참석 체크하기', link: { mobileWebUrl: location.href, webUrl: location.href } }]
  });
}

document.getElementById('create-sess-btn').onclick = async () => {
  const name = document.getElementById('pub-sess-name').value;
  const date = document.getElementById('pub-sess-date').value;
  const category = document.getElementById('pub-sess-cat').value;
  if(!name || !date) return toast('내용을 입력하세요');
  await db.collection('sessions').add({ name, date, category, attendees: [], absentees: [] });
  renderSessionsTab(); toast('일정이 등록되었습니다!');
};

window.doAttend = async (sid, mid, a) => {
  const ref = db.collection('sessions').doc(sid);
  const s = (await ref.get()).data();
  const next = a ? s.attendees.filter(x => x.memberId !== mid) : [...(s.attendees||[]), {memberId: mid}];
  await ref.update({ attendees: next });
  renderSessionsTab(); toast(a ? '참석 취소' : '참석 완료!');
};

document.querySelectorAll('.nb').forEach(btn => btn.onclick = () => {
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('page-'+btn.dataset.page).classList.add('active');
  if(btn.dataset.page === 'sessions') renderSessionsTab();
});

renderSessionsTab();
</script>
</body>
</html>
